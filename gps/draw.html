<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Draw As-built</title>
<style>
  :root { --bg:#f3f5f4; --panel:#ffffff; --ink:#14201b; --muted:#4a5852; --line:#d3dbd7; --accent:#0b6e4f; --accent-ink:#fff; --red:#c62828; --hi:#ffd200;
          --body:-apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#111417; --panel:#1d2227; --ink:#f1f4f6; --muted:#c3cbd2; --line:#3c454e; --accent:#3dbe8b; --accent-ink:#06130e; --red:#ff6b6b; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:16px/1.3 var(--body); overflow:hidden; }
  body { display:flex; flex-direction:column; height:100dvh; }
  button, a.btn { font:inherit; border:0; border-radius:10px; padding:10px 13px; min-height:44px; cursor:pointer; text-decoration:none;
                  background:var(--panel); color:var(--ink); border:1px solid var(--line); display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  button.danger { background:var(--red); color:#fff; border-color:var(--red); }
  button.on { outline:3px solid var(--accent); outline-offset:-3px; font-weight:600; }
  #bar { display:flex; align-items:center; gap:8px; padding:6px 10px; padding-top:max(6px, env(safe-area-inset-top)); background:var(--panel); border-bottom:1px solid var(--line); }
  #bar .ttl { flex:1; min-width:0; line-height:1.15; }
  #bar .ttl b { display:block; font-size:17px; white-space:nowrap; }
  #bar .ttl span { display:block; font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #bar .meta { text-align:right; font-size:12px; color:var(--muted); line-height:1.25; white-space:nowrap; max-width:42vw; overflow:hidden; text-overflow:ellipsis; }
  #bar .meta div { overflow:hidden; text-overflow:ellipsis; }
  #wrap { position:relative; flex:1; min-height:0; background:#fff; }
  #cv { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #hint { position:absolute; left:8px; right:8px; top:8px; background:var(--panel); color:var(--ink); border:2px solid var(--accent); border-radius:12px;
          padding:8px 10px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; box-shadow:0 2px 10px rgba(0,0,0,.18); }
  #hint-t { flex:1 1 220px; font-size:15px; }
  #hint .hb { display:flex; gap:6px; flex-wrap:wrap; }
  #hint button { min-height:38px; padding:6px 11px; }
  #sel { background:var(--panel); border-top:1px solid var(--line); padding:8px 10px; display:flex; flex-direction:column; gap:8px; }
  #sel .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #sel .nm { font-weight:700; font-size:17px; flex:1; }
  #sel input[type=range] { flex:1; min-width:120px; height:34px; }
  #sel select { font:inherit; min-height:44px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:0 8px; }
  #tools { display:flex; gap:6px; padding:8px 10px; padding-bottom:max(8px, env(safe-area-inset-bottom)); background:var(--panel); border-top:1px solid var(--line); flex-wrap:wrap; }
  #tools button { flex:1 0 auto; padding:8px 10px; }
  .small { font-size:13px; color:var(--muted); }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  #card { background:var(--panel); color:var(--ink); width:100%; max-width:640px; max-height:92dvh; overflow:auto; border-radius:16px 16px 0 0; padding:14px 14px max(14px, env(safe-area-inset-bottom)); position:relative; }
  @media (min-width:700px) { #modal { align-items:center; } #card { border-radius:16px; } }
  #card h2 { margin:0 0 4px; font-size:20px; padding-right:70px; }
  #card h3 { margin:14px 0 6px; font-size:15px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  #card .pg { position:absolute; top:10px; right:14px; font-size:12px; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(100px, 1fr)); gap:8px; }
  .grid button { flex-direction:column; padding:8px 4px; min-height:92px; font-size:14px; text-align:center; line-height:1.15; }
  .grid img { width:44px; height:44px; }
  .list { display:flex; flex-direction:column; gap:8px; }
  .list button { justify-content:flex-start; text-align:left; }
  .swl { display:inline-block; width:46px; height:0; border-top:5px solid; vertical-align:middle; }
  .acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .acts button { flex:1 1 auto; }
  label.f { display:block; margin-top:10px; }
  label.f span { display:block; font-size:14px; color:var(--muted); margin-bottom:4px; }
  label.f input[type=text] { width:100%; font:inherit; font-size:20px; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; max-height:30vh; overflow:auto; }
  .chips button { min-height:38px; padding:6px 10px; font-size:15px; }
  .sw { display:flex; flex-wrap:wrap; gap:6px; }
  .sw button { width:40px; height:40px; min-height:40px; padding:0; border-radius:50%; border:2px solid var(--line); }
  .sw button.on { outline:3px solid var(--ink); outline-offset:1px; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; }
  .preview { margin-top:10px; padding:10px; border-radius:10px; background:var(--bg); font-size:16px; }
  #toast { position:fixed; left:50%; bottom:110px; transform:translateX(-50%); background:#14201b; color:#fff; padding:10px 16px; border-radius:22px; z-index:30; font-size:15px; max-width:90vw; text-align:center; }
  /* the as-built list (Steven 2026-11-20) */
  #list { flex:1; min-height:0; overflow:auto; padding:12px 12px max(12px, env(safe-area-inset-bottom)); }
  #list .top { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  #list .top button { flex:1 1 auto; }
  #list h2 { margin:4px 0 10px; font-size:20px; }
  .sh { display:flex; gap:8px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px; margin-bottom:8px; }
  .sh .open { flex:1; min-width:0; justify-content:flex-start; text-align:left; border:0; background:none; flex-direction:column; align-items:flex-start; gap:2px; padding:6px 8px; }
  .sh .open b { font-size:18px; }
  .sh .open span { font-size:13px; color:var(--muted); }
  .sh .act { min-height:40px; padding:6px 10px; font-size:14px; }
  @media (max-width:520px) { .sh { flex-wrap:wrap; } .sh .open { flex-basis:100%; } }
  .ck { display:flex; align-items:center; gap:8px; min-height:40px; font-size:16px; }
  .ck input { width:24px; height:24px; }
  #pg { position:absolute; right:6px; bottom:4px; font-size:11px; color:#666; background:rgba(255,255,255,.7); padding:1px 5px; border-radius:6px; pointer-events:none; }
</style>
</head>
<body>
<div id="bar">
  <a class="btn" id="back" href="./">Back</a>
  <div class="ttl"><b>Draw as-built</b><span id="proj">Loading…</span></div>
  <div class="meta"><div id="save"></div><div id="ver"></div></div>
</div>
<div id="list"><p>Loading…</p></div>
<div id="wrap" hidden>
  <canvas id="cv"></canvas>
  <div id="hint" hidden><span id="hint-t"></span><span class="hb" id="hint-b"></span></div>
  <div id="pg">Page D-1</div>
</div>
<div id="sel" hidden></div>
<div id="tools" hidden>
  <button class="primary" id="t-icon">Add icon</button>
  <button class="primary" id="t-line">Draw line</button>
  <button id="t-words">Move words</button>
  <button id="t-size">Icon size</button>
  <button id="t-undo">Undo</button>
  <button id="t-print">Print: faded</button>
  <button id="t-others">Others: faded</button>
  <button id="t-fit">Whole print</button>
  <button id="t-save">Save PDF 36x48</button>
</div>
<div id="modal" hidden><div id="card"></div></div>
<div id="toast" hidden></div>

<script>
"use strict";
/* Draw as-built (Steven 2026-10-08): his own as-built drawn by hand on the job's print, kept as a SEPARATE print from the
   GPS one. Saved in ASBUILT_MAKER gps/drawn/<slug>.json. Icon names are the same location names the designer and
   GPS Shots use: a typed name that matches one (18 for a lockbox = LB-18) is that location; any other becomes a new
   location GPS Shots lists and can plot (gpsName / gk / gg below are what GPS Shots reads). Lines start on one icon
   and end on another and stay attached when an icon moves. */
const APP_VERSION = "V 01.23";
// phones keep an old copy of this page for a while: load the newest one when it changes (same as GPS Shots)
(async () => {
  try {
    const r = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
    const m = (await r.text()).match(/APP_VERSION = "([^"]+)"/);
    if (m && m[1] !== APP_VERSION && sessionStorage.getItem("draw.upd") !== m[1]) {
      sessionStorage.setItem("draw.upd", m[1]); const q = new URLSearchParams(location.search); q.set("v", m[1]); location.replace(location.pathname + "?" + q);
    }
  } catch {}
})();
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem("gps." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("gps." + k, JSON.stringify(v)); return true; } catch { return false; } },
};
$("ver").textContent = APP_VERSION;
const slug = new URLSearchParams(location.search).get("p") || LS.get("current", "");
const cfg = Object.assign({ token: "", repo: "sgogats/ASBUILT_MAKER", branch: "main" }, LS.get("cfg", {}) || {});
$("back").href = "./";
$("back").onclick = e => {
  if (sheet) { e.preventDefault(); if (history.state && history.state.sheet) history.back(); else showList(true); return; }   // from an as-built back to the list
  if (history.length > 1) { e.preventDefault(); history.back(); }
};

function b64(str) { const bytes = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); return btoa(s); }
function decodeB64(s) { const bin = atob(s.replace(/\n/g, "")); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
const gh = {
  on() { return !!cfg.token; },
  url(path) { return `https://api.github.com/repos/${cfg.repo}/contents/${path.split("/").map(encodeURIComponent).join("/")}`; },
  headers(raw) { return { Authorization: "Bearer " + cfg.token, Accept: raw ? "application/vnd.github.raw+json" : "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }; },
  async get(path, raw) {
    const r = await fetch(this.url(path) + "?ref=" + encodeURIComponent(cfg.branch) + "&t=" + Date.now(), { headers: this.headers(raw), cache: "no-store" });
    if (r.status === 404) return null;
    if (!r.ok) { const e = new Error("GitHub said " + r.status); e.status = r.status; throw e; }
    return raw === "blob" ? r.blob() : r.json();
  },
  async put(path, obj, sha, message) {
    const body = { message, branch: cfg.branch, content: b64(JSON.stringify(obj, null, 1)) };
    if (sha) body.sha = sha;
    const r = await fetch(this.url(path), { method: "PUT", headers: this.headers(false), body: JSON.stringify(body) });
    if (!r.ok) { const e = new Error("GitHub said " + r.status); e.status = r.status; throw e; }
    return r.json();
  },
};
const idbGet = k => new Promise(ok => { try { const q = indexedDB.open("gps", 1); q.onupgradeneeded = () => q.result.createObjectStore("kv"); q.onerror = () => ok(null);
  q.onsuccess = () => { try { const g = q.result.transaction("kv").objectStore("kv").get(k); g.onsuccess = () => ok(g.result || null); g.onerror = () => ok(null); } catch { ok(null); } }; } catch { ok(null); } });

let toastT = null;
function toast(t) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }

/* ---------------------------------------------------------------- icons and line types
   Steven's own: blue rectangle = vault, red triangle = lockbox, circle with X = pole, circle with X and a small R circle = riser pole,
   orange line = 2" conduit, gray line = 1" conduit. Electric / water / cable TV follow the usual utility map symbols and
   colors (red electric, blue water, orange cable TV). Every one can be renamed and recolored; renames are kept per job. */
const GROUPS = ["Telecom", "Electric", "Water", "Cable TV", "My icons"];
const DEF_KINDS = {
  vault:   { name: "Vault", color: "#1f5fd6", shape: "rect", grp: "Telecom", gk: "Lockbox vault", gg: "Vaults, cans and poles", match: ["Lockbox vault", "Vault", "Can", "Main", "MDU entry"], pre: "v" },
  lockbox: { name: "Lockbox", color: "#d62828", shape: "tri", grp: "Telecom", gk: "Lockbox", gg: "Added in field", match: ["Lockbox"], pre: "lb" },
  pole:    { name: "Pole", color: "#222222", shape: "pole", grp: "Telecom", gk: "Pole line", gg: "Pole line", match: ["Pole line", "Pole"], pre: "" },
  riser:   { name: "Riser pole", color: "#222222", shape: "riser", grp: "Telecom", gk: "Riser pole", gg: "Vaults, cans and poles", match: ["Riser pole"], pre: "rp" },
  ped:     { name: "Pedestal", color: "#4b5563", shape: "ped", grp: "Telecom", gk: "Pedestal", gg: "Pedestal", match: ["Pedestal"] },
  splice:  { name: "Splice can", color: "#111111", shape: "bowtie", grp: "Telecom", gk: "Splice can", gg: "Splice can", match: ["Splice can"] },
  nid:     { name: "NID panel", color: "#1f6feb", shape: "box", letter: "NID", grp: "Telecom", gk: "NID panel", gg: "NID panels" },
  xfmr:    { name: "Transformer", color: "#c1121f", shape: "box", letter: "T", grp: "Electric" },
  emeter:  { name: "Electric meter", color: "#c1121f", shape: "circ", letter: "M", grp: "Electric" },
  ebox:    { name: "Electric handhole", color: "#c1121f", shape: "box", letter: "E", grp: "Electric" },
  light:   { name: "Light pole", color: "#c1121f", shape: "light", grp: "Electric" },
  wvalve:  { name: "Water valve", color: "#1565c0", shape: "valve", grp: "Water" },
  hydrant: { name: "Fire hydrant", color: "#1565c0", shape: "hydrant", grp: "Water" },
  wmeter:  { name: "Water meter", color: "#1565c0", shape: "box", letter: "W", grp: "Water" },
  tvped:   { name: "Cable TV pedestal", color: "#e07000", shape: "box", letter: "TV", grp: "Cable TV" },
  tvamp:   { name: "Cable TV amplifier", color: "#e07000", shape: "amp", grp: "Cable TV" },
  tvtap:   { name: "Cable TV tap", color: "#e07000", shape: "circ", letter: "T", grp: "Cable TV" },
};
const SHAPES = { rect: "Rectangle", tri: "Triangle", pole: "Circle with X", riser: "Riser pole", ped: "Pedestal", box: "Box with letters",
                 circ: "Circle with letters", valve: "Valve", hydrant: "Hydrant", amp: "Amplifier", light: "Light", dot: "Dot", diamond: "Diamond", bowtie: "Two triangles point to point" };
const DEF_LINES = {
  c2:    { name: '2" conduit', color: "#f28c28", w: 3.5, dash: "" },
  c1:    { name: '1" conduit', color: "#8a8f98", w: 3, dash: "" },
  elec:  { name: "Electric", color: "#c1121f", w: 3, dash: "dash" },
  water: { name: "Water", color: "#1565c0", w: 3, dash: "dash" },
  tv:    { name: "Cable TV", color: "#e07000", w: 3, dash: "dot" },
  aerial: { name: "Aerial", color: "#222222", w: 2.5, dash: "" },   // the wire between poles (Steven 2026-11-20)
};
const COLORS = ["#d62828", "#c1121f", "#f28c28", "#e07000", "#f2c500", "#2e9d4f", "#0b6e4f", "#1f5fd6", "#1565c0", "#7b3fbf", "#8a8f98", "#4b5563", "#6d4c41", "#222222"];
const DASH = { "": [], dash: [12, 6], dot: [3, 5] };

let doc = null;           // the drawing
let plan = null, ppf = 0, projName = slug, names = [];   // print, print points per foot, location names shared with the designer / GPS Shots
let kCache = null, lCache = null;
const kinds = () => { if (kCache) return kCache; const o = kCache = {}; for (const [k, v] of Object.entries(DEF_KINDS)) o[k] = Object.assign({}, v, (doc.kinds || {})[k]); for (const [k, v] of Object.entries(doc.kinds || {})) if (!o[k]) o[k] = Object.assign({ grp: "My icons" }, v); return o; };
const lineKinds = () => { if (lCache) return lCache; const o = lCache = {}; for (const [k, v] of Object.entries(DEF_LINES)) o[k] = Object.assign({}, v, (doc.lineKinds || {})[k]); for (const [k, v] of Object.entries(doc.lineKinds || {})) if (!o[k]) o[k] = Object.assign({ w: 3, dash: "" }, v); return o; };
const kindOf = it => kinds()[it.k] || { name: "Icon", color: "#444", shape: "dot" };
function label(it) {   // Steven: type 18 for a lockbox and the print says "Lockbox 18"
  const kn = kindOf(it).name, n = String(it.name || "").trim();
  if (!n) return kn;
  return n.toLowerCase().startsWith(kn.toLowerCase()) ? n : kn + " " + n;
}
const newDoc = () => ({ project: projName, slug, v: 1, updated: 0, kinds: {}, lineKinds: {}, items: [], lines: [] });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ---------------------------------------------------------------- as-builts (Steven 2026-11-20)
   One drawing per job, many as-builts of it, kept in doc.sheets:
   - the Composite: everything (the drawing as it was before),
   - one per building: cut down to the building's outline plus a little room, turned so it lies landscape,
   - ones that show only some icon and line types (Conduit and vaults, Aerial, Fiber, ...). The rest shows faded or hidden.
   They are all views of the same drawing, so a change on any of them is a change on the Composite and on the others. */
let sheet = null, job = null, rdata = null;
let mainDoc = null, mainPlan = null, mainPpf = 0;   // the job print's drawing (holds the list of as-builts and extra prints) and print
const rot = () => (sheet && sheet.rot) || 0;
function rotPt(p, r) {
  if (!r) return { x: p.x, y: p.y };
  const a = r * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  return { x: p.x * c - p.y * s, y: p.x * s + p.y * c };
}
const PRESETS = {
  cv:      { name: "Conduit and vaults", lineRx: "conduit", iconRx: "vault|lockbox", icons: ["vault", "lockbox"] },
  conduit: { name: "Conduit", lineRx: "conduit" },
  vaults:  { name: "Vaults", iconRx: "vault", icons: ["vault"] },
  fiber:   { name: "Fiber", lineRx: "^(?!.*drop).*fiber", icons: ["splice"] },
  drops:   { name: "Drops", lineRx: "drop", icons: ["nid"] },
  aerial:  { name: "Aerial", lineRx: "aerial|strand", icons: ["pole", "riser"] },
};
const presetSheet = (key, name) => Object.assign({ id: uid(), type: "pick", lines: [], icons: [] }, JSON.parse(JSON.stringify(PRESETS[key])), name ? { name } : {});
function picks(sh, isLine, k) {   // does this as-built show this icon / line type?
  const list = isLine ? sh.lines : sh.icons, rx = isLine ? sh.lineRx : sh.iconRx, kd = isLine ? lineKinds()[k] : kinds()[k];
  if ((list || []).includes(k)) return true;
  if (rx && kd) { try { return new RegExp(rx, "i").test(kd.name); } catch { } }
  return false;
}
let othersMode = LS.get("draw.others", "faded");   // what is not on this as-built: faded / off
const FADE = 0.22;
function vis(o, isLine, sh = sheet) {   // "on", "faded" or "off"
  if (sh && sh.type === "bldg" && !isLine && !inBox(o, sh)) return "off";
  if (!sh || sh.type !== "pick") return "on";
  return picks(sh, isLine, o.k) ? "on" : othersMode === "off" ? "off" : "faded";
}
const inBox = (p, sh) => { const b = sh.box; return p.x >= b[0] && p.x <= b[2] && p.y >= b[1] && p.y <= b[3]; };
function bldgSheet(b) {   // the building outline from the designer, a little room around it, and its own lockboxes / vaults close by
  let [x0, y0, x1, y1] = b.box; const w = x1 - x0, h = y1 - y0;
  const m = Math.max(0.2 * Math.max(w, h), ppf ? 25 * ppf : 36), near = ppf ? 60 * ppf : 90;
  const num = String(b.name).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), own = new RegExp("(^|[^0-9])" + num + "[A-Z]?([^0-9]|$)", "i");
  let X0 = x0 - m, Y0 = y0 - m, X1 = x1 + m, Y1 = y1 + m;
  for (const it of doc.items) {
    if (!/^(lockbox|vault)$/.test(it.k) || !own.test(String(it.name || ""))) continue;
    if (it.x < x0 - near || it.x > x1 + near || it.y < y0 - near || it.y > y1 + near) continue;
    const pad = iconSize() * 3; X0 = Math.min(X0, it.x - pad); Y0 = Math.min(Y0, it.y - pad); X1 = Math.max(X1, it.x + pad); Y1 = Math.max(Y1, it.y + pad);
  }
  const box = [X0, Y0, X1, Y1].map(v => Math.round(v * 10) / 10);
  return { id: uid(), name: "Building " + b.name, type: "bldg", bldg: String(b.name), box, rot: (box[3] - box[1]) > (box[2] - box[0]) ? 90 : 0 };

    if (selWord) {   // Steven 2026-10-08: turn a word so it lines up with its road
      const w = selWord;
      t.innerHTML = `<b>${esc(w.text)}</b>: drag it to move it, or turn it to line up with the road.`;
      let s0 = null;
      const setR = (v, commit) => { if (s0 == null) s0 = snap(); const m = moveOf(w); let r = ((Math.round(v) + 180) % 360 + 360) % 360 - 180;
        doc.textMoves = doc.textMoves || {}; doc.textMoves[w.key] = [m[0], m[1], r]; $("wr-t").textContent = r + "°"; $("wr-r").value = r; wordsVer++; draw();
        if (commit) { undo.push(s0); s0 = null; changed(); } };
      btn("⟲ 5°", () => setR(moveOf(w)[2] - 5, true));
      const r = document.createElement("input"); r.type = "range"; r.id = "wr-r"; r.min = -180; r.max = 180; r.step = 1; r.value = moveOf(w)[2]; r.style.minWidth = "120px"; r.style.flex = "1";
      r.oninput = () => setR(+r.value, false); r.onchange = () => setR(+r.value, true); b.appendChild(r);
      btn("⟳ 5°", () => setR(moveOf(w)[2] + 5, true));
      const tt = document.createElement("b"); tt.id = "wr-t"; tt.textContent = moveOf(w)[2] + "°"; b.appendChild(tt);
      btn("Put this word back", () => { before(); delete doc.textMoves[w.key]; wordsVer++; changed(); showHint(); });
      btn("Done", () => { selWord = null; showHint(); draw(); }, "primary");
      return;
    }
    t.innerHTML = `Tap a street name or any word to turn it, or drag it to move it. This only changes your drawing, not the GPS print.`;
    if (Object.keys(doc.textMoves || {}).length) btn("Put all words back", () => { if (!confirm("Put every word back where the print had it?")) return; before(); doc.textMoves = {}; wordsVer++; changed(); showHint(); });
    btn("Done", () => setMode("view"), "primary");
    return;
  }
  if (mode === "place") {
    t.innerHTML = `Tap the print where the <b>${esc(kinds()[placeKind].name)}</b> goes. Two fingers to zoom.`;
    btn("Done", () => setMode("view"));
    return;
  }
  const ln = esc((lineKinds()[lineKind] || {}).name);
  if (!cur) t.innerHTML = lineStyle === "free"
    ? `<b>${ln}</b>: put your finger on the icon where it starts and draw to the icon where it ends.`
    : `<b>${ln}</b>: tap the icon where it starts.`;
  else t.innerHTML = lineStyle === "free"
    ? `<b>${ln}</b>: keep drawing and end on an icon, or tap the end icon.`
    : `<b>${ln}</b>: tap to add dots, then tap the icon where it ends.`;
  btn(lineStyle === "free" ? "Switch to dots" : "Switch to freehand", () => { lineStyle = lineStyle === "free" ? "dots" : "free"; LS.set("draw.ls", lineStyle); showHint(); draw(); });
  if (cur && cur.pts.length) btn("Undo last bit", () => { if (lineStyle === "dots") cur.pts.splice(-2, 2); else cur.pts.length = 0; showHint(); draw(); });
  if (cur) btn("Cancel line", () => { cur = null; showHint(); draw(); });
  btn("Done", () => setMode("view"), "primary");
}
document.addEventListener("keydown", e => {
  if (!$("modal").hidden || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === "Escape") { if (cur) { cur = null; showHint(); draw(); } else setMode("view"); }
  else if ((e.key === "Delete" || e.key === "Backspace") && sel) { e.preventDefault(); delSel(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); $("t-undo").click(); }
});

/* ---------------------------------------------------------------- selected icon / line */
function renderSel() {
  const box = $("sel");
  if (!sel || mode !== "view") { box.hidden = true; return; }
  if (sel.type === "icon") {
    const it = itemById(sel.id); if (!it) { sel = null; box.hidden = true; return; }
    const link = it.gpsName && it.gpsName !== label(it) ? ` <span class="small">· same as ${esc(it.gpsName)}</span>` : "";
    box.innerHTML = `<div class="row"><span class="nm">${esc(label(it))}${link}</span><span class="small">Drag the icon to move it</span></div>
      <div class="row"><button id="r-l" aria-label="Turn left">⟲ 15°</button><input type="range" id="r-v" min="0" max="359" step="1" value="${Math.round(it.rot || 0)}"><button id="r-r" aria-label="Turn right">⟳ 15°</button><b id="r-t" style="min-width:44px;text-align:right">${Math.round(it.rot || 0)}°</b></div>
      <div class="row"><button id="s-ren">Rename</button><button id="s-del" class="danger">Delete</button><button id="s-done" class="primary" style="margin-left:auto">Done</button></div>
      ${sizeHtml("ts", `Icon size (every ${esc(kindOf(it).name)})`, typeSize(it.k), "")}
      ${sizeHtml("ns", "Name size (this icon, also on the PDF)", it.nameSize || nameSize(), "Make all names this size")}`;
    doc.typeSize = doc.typeSize || {};
    sizeRow("ts", doc.typeSize, it.k, () => typeSize(it.k), null);
    sizeRow("ns", it, "nameSize", () => it.nameSize || nameSize(), doc.items);
    let rotSnap = null;
    const setRot = (v, commit) => { if (!rotSnap) rotSnap = snap(); it.rot = ((Math.round(v) % 360) + 360) % 360; $("r-t").textContent = it.rot + "°"; $("r-v").value = it.rot; draw();
      if (commit) { undo.push(rotSnap); rotSnap = null; changed(); } };
    $("r-l").onclick = () => setRot((it.rot || 0) - 15, true);
    $("r-r").onclick = () => setRot((it.rot || 0) + 15, true);
    $("r-v").oninput = e => setRot(+e.target.value, false);
    $("r-v").onchange = e => setRot(+e.target.value, true);
    $("s-ren").onclick = () => nameDialog(it, false);
  } else {
    const ln = doc.lines.find(l => l.id === sel.id); if (!ln) { sel = null; box.hidden = true; return; }
    const lks = lineKinds(), a = itemById(ln.a), b = itemById(ln.b), f = feet(linePts(ln));
    box.innerHTML = `<div class="row"><span class="nm">${esc((lks[ln.k] || {}).name || "Line")}</span><span class="small">${esc(a ? label(a) : "?")} to ${esc(b ? label(b) : "?")}${f != null ? " · " + Math.round(f) + " ft" : ""}</span></div>
      <div class="row"><select id="s-lk" aria-label="Line type">${Object.entries(lks).map(([k, v]) => `<option value="${k}"${k === ln.k ? " selected" : ""}>${esc(v.name)}</option>`).join("")}</select>
      <label class="small" style="display:flex;align-items:center;gap:6px">Length <input type="text" id="s-len" inputmode="decimal" value="${esc(ln.len || "")}" placeholder="${f != null ? Math.round(f) : "ft"}" autocomplete="off" style="width:90px;font:inherit;min-height:44px;border-radius:10px;border:1px solid var(--line);padding:0 8px"> ft</label>
      <button id="s-del" class="danger">Delete</button><button id="s-done" class="primary" style="margin-left:auto">Done</button></div>
      ${sizeHtml("ls", "Length size (this line, also on the PDF)", ln.lenSize || lenSize(), "Make all lengths this size")}`;
    sizeRow("ls", ln, "lenSize", () => ln.lenSize || lenSize(), doc.lines);
    $("s-lk").onchange = e => { before(); ln.k = e.target.value; changed(); };
    let lenSnap = null;   // one undo step for the whole typed length
    $("s-len").oninput = e => { if (!lenSnap) { before(); lenSnap = 1; } const v = e.target.value.trim(); if (v) ln.len = v; else delete ln.len; doc.updated = Date.now(); keepLocal(); scheduleSave(); draw(); };   // not changed(): that redraws this box and drops the keyboard
    $("s-len").onblur = () => { lenSnap = null; };
  }
  $("s-del").onclick = delSel;
  $("s-done").onclick = () => { sel = null; renderSel(); draw(); };
  box.hidden = false;
}
/* A− / slider / A+ for one icon's name or one line's length (Steven 2026-10-10: "when I click on a vault, I can resize the name").
   Sizes are print units on the item (it.nameSize / ln.lenSize); "Make all … this size" sets the job default and clears the others. */
const sizeHtml = (id, text, v, all) => `<div class="row"><span class="small" style="flex-basis:100%">${text}</span><button id="${id}-m" aria-label="Smaller">A−</button><input type="range" id="${id}-r" min="${Math.log(0.2)}" max="${Math.log(80)}" step="0.01" value="${Math.log(v)}"><button id="${id}-p" aria-label="Bigger">A+</button>${all ? `<button id="${id}-a">${all}</button>` : ""}</div>`;
function sizeRow(id, obj, key, get, list) {
  let s0 = null;
  if (list) $(id + "-a").onclick = () => { before(); doc[key] = get(); for (const o of list) delete o[key]; changed(); toast("Done: all the same size"); };
  const set = (v, commit) => { if (!s0) s0 = snap(); obj[key] = Math.max(0.2, Math.min(80, v)); $(id + "-r").value = Math.log(obj[key]); draw();
    if (commit) { undo.push(s0); s0 = null; doc.updated = Date.now(); keepLocal(); scheduleSave(); } };
  $(id + "-m").onclick = () => set(get() / 1.25, true);
  $(id + "-p").onclick = () => set(get() * 1.25, true);
  $(id + "-r").oninput = e => set(Math.exp(+e.target.value), false);
  $(id + "-r").onchange = e => set(Math.exp(+e.target.value), true);
}
function delSel() {
  if (!sel) return;
  if (sel.type === "icon") {
    const it = itemById(sel.id), n = doc.lines.filter(l => l.a === sel.id || l.b === sel.id).length;
    if (!confirm(`Delete ${label(it)}${n ? ` and the ${n} line${n > 1 ? "s" : ""} attached to it` : ""}?`)) return;
    before(); doc.items = doc.items.filter(i => i.id !== sel.id); doc.lines = doc.lines.filter(l => l.a !== sel.id && l.b !== sel.id);
  } else { before(); doc.lines = doc.lines.filter(l => l.id !== sel.id); }
  sel = null; changed();
}

/* ---------------------------------------------------------------- dialogs */
function openCard(html, page) { $("card").innerHTML = `<div class="pg">Page ${page}</div>` + html; $("modal").hidden = false; $("pg").textContent = "Page " + page; }
function closeCard() { $("modal").hidden = true; $("pg").textContent = "Page D-1"; }
$("modal").addEventListener("click", e => { if (e.target === $("modal")) { const c = $("card").querySelector("[data-cancel]"); if (c) c.click(); else closeCard(); } });
const iconImg = (kd, size = 44) => {
  const c = document.createElement("canvas"); c.width = c.height = size * 2; const g = c.getContext("2d");
  g.scale(2, 2); g.translate(size / 2, size / 2); iconShape(g, kd, size * 0.3); return c.toDataURL();
};

// D-2: pick an icon (or edit them)
let editIcons = false;
function iconPicker() {
  const ks = kinds(), by = {};
  for (const [k, v] of Object.entries(ks)) (by[v.grp || "My icons"] = by[v.grp || "My icons"] || []).push([k, v]);
  let html = `<h2>${editIcons ? "Tap an icon to rename or recolor it" : "Pick an icon"}</h2>`;
  for (const g of GROUPS) { if (!by[g]) continue;
    html += `<h3>${g}</h3><div class="grid">` + by[g].map(([k, v]) => `<button data-k="${k}"><img alt="" src="${iconImg(v)}">${esc(v.name)}</button>`).join("") + `</div>`; }
  html += `<div class="acts">${editIcons ? `<button id="ip-new">+ New icon</button>` : ""}<button id="ip-edit">${editIcons ? "Done editing" : "Rename / color"}</button><button data-cancel id="ip-x">Close</button></div>`;
  openCard(html, "D-2");
  for (const b of $("card").querySelectorAll("[data-k]")) b.onclick = () => {
    if (editIcons) { iconEditor(b.dataset.k); return; }
    placeKind = b.dataset.k; closeCard(); setMode("place");
  };
  $("ip-edit").onclick = () => { editIcons = !editIcons; iconPicker(); };
  $("ip-x").onclick = closeCard;
  if (editIcons) $("ip-new").onclick = () => iconEditor(null);
}
$("t-icon").onclick = () => { if (mode === "place") { setMode("view"); return; } editIcons = false; iconPicker(); };

// D-4: rename / recolor an icon, or make a new one
function iconEditor(k) {
  const ks = kinds(), isNew = !k, base = DEF_KINDS[k], v = Object.assign({ name: "", color: "#7b3fbf", shape: "dot", letter: "" }, k ? ks[k] : {});

  const swatches = () => COLORS.map(c => `<button data-c="${c}" class="${c === v.color ? "on" : ""}" style="background:${c}" aria-label="${c}"></button>`).join("") + `<input type="color" id="ie-c" value="${v.color}" style="width:46px;height:40px;border:0;background:none">`;
  const draw1 = () => { $("ie-prev").innerHTML = `<img alt="" src="${iconImg(v, 56)}" style="vertical-align:middle"> <b>${esc(v.name || "New icon")} 18</b> <span class="small">is how it shows on the print</span>`;
    $("ie-sw").innerHTML = swatches(); for (const b of $("ie-sw").querySelectorAll("[data-c]")) b.onclick = () => { v.color = b.dataset.c; draw1(); };
    $("ie-c").oninput = e => { v.color = e.target.value; draw1(); };

  openCard(`<h2>${isNew ? "New icon" : "Edit " + esc(ks[k].name)}</h2>
    <label class="f"><span>Name</span><input type="text" id="ie-n" value="${esc(v.name)}" autocomplete="off"></label>
    <label class="f"><span>Color</span></label><div class="sw" id="ie-sw"></div>
    ${!base ? `<label class="f"><span>Shape</span></label><div class="seg" id="ie-sh">${Object.entries(SHAPES).map(([s, t]) => `<button data-s="${s}" class="${s === v.shape ? "on" : ""}">${t}</button>`).join("")}</div>` : ""}
    <label class="f" id="ie-lt"><span>Letters inside</span><input type="text" id="ie-l" value="${esc(v.letter || "")}" maxlength="3" autocomplete="off"></label>
    <div class="preview" id="ie-prev"></div>
    <div class="acts"><button class="primary" id="ie-ok">Save</button>${base && (doc.kinds || {})[k] ? `<button id="ie-reset">Put back original</button>` : ""}${!base && !isNew ? `<button class="danger" id="ie-del">Delete icon</button>` : ""}<button data-cancel id="ie-x">Cancel</button></div>`, "D-4");
  draw1();

  for (const b of $("card").querySelectorAll("[data-s]")) b.onclick = () => { v.shape = b.dataset.s; for (const x of $("card").querySelectorAll("[data-s]")) x.classList.toggle("on", x === b); draw1(); };

  if ($("ie-del")) $("ie-del").onclick = () => { if (used) { toast(`It's on the print ${used} time${used > 1 ? "s" : ""}. Delete those first.`); return; } before(); delete doc.kinds[k]; changed(); iconPicker(); };

// D-3: name the icon. The list offers the names the designer and GPS Shots already use for this type.

    <div class="preview" id="nd-p"></div>

    <div class="acts"><button class="primary" id="nd-ok">${isNew ? "Place it" : "Save"}</button><button data-cancel id="nd-x">${isNew ? "Don't place it" : "Cancel"}</button></div>`, "D-3");
  const inp = $("nd-n");

/* ---------------------------------------------------------------- print on/off, fit, picture */

  const img = new Image(); await new Promise((ok, no) => { img.onload = ok; img.onerror = () => no(new Error("couldn't read the picture")); img.src = URL.createObjectURL(file); });
  const k = Math.min(1, 5000 / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
  return { blob: await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.85)), w: c.width, h: c.height };
}
async function dxfToPlan(text) {   // same as GPS Shots
  if (!window.DxfParser) await loadScript("https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.js");
  const P = window.DxfParser.default || window.DxfParser, dxf = new P().parseSync(text), blocks = dxf.blocks || {};

  const clean = t => String(t).replace(/\\P/g, " ").replace(/\\[A-Za-z][^;\\]*;/g, "").replace(/[{}]/g, "").trim();
  function walk(ents, tf, sc, depth) {
    for (const e of ents || []) {
      if (e.type === "LINE" && e.vertices) segs.push(e.vertices.map(tf));
      else if ((e.type === "LWPOLYLINE" || e.type === "POLYLINE") && e.vertices && e.vertices.length > 1) { const v = e.vertices.map(tf); if (e.shape || e.closed) v.push(v[0]); segs.push(v); }
      else if ((e.type === "CIRCLE" || e.type === "ARC") && e.center) {
        const a0 = e.type === "CIRCLE" ? 0 : e.startAngle; let span = e.type === "CIRCLE" ? 2 * Math.PI : e.endAngle - e.startAngle; if (span <= 0) span += 2 * Math.PI;
        const n = Math.max(8, Math.ceil(span / (Math.PI / 18))), v = [];
        for (let i = 0; i <= n; i++) { const a = a0 + span * i / n; v.push(tf({ x: e.center.x + e.radius * Math.cos(a), y: e.center.y + e.radius * Math.sin(a) })); }
        segs.push(v);
      }
      else if ((e.type === "TEXT" || e.type === "MTEXT") && e.text) { const p = e.startPoint || e.position; if (p) texts.push([tf(p), clean(e.text), (e.textHeight || e.height || 1) * sc]); }
      else if (e.type === "INSERT" && depth < 6 && blocks[e.name]) {
        const b = blocks[e.name], bp = b.position || { x: 0, y: 0 }, at = e.position || { x: 0, y: 0 }, xs = e.xScale || 1, ys = e.yScale || 1, r = (e.rotation || 0) * Math.PI / 180, cs = Math.cos(r), sn = Math.sin(r);
        walk(b.entities, p => { const x = (p.x - bp.x) * xs, y = (p.y - bp.y) * ys; return tf({ x: at.x + x * cs - y * sn, y: at.y + x * sn + y * cs }); }, sc * Math.abs(xs), depth + 1);
      }
    }
  }
  walk(dxf.entities, p => ({ x: p.x, y: p.y }), 1, 0);
  const all = segs.flat().concat(texts.map(t => t[0])); if (!all.length) throw new Error("no drawing found in this DXF");
  const xs = all.map(p => p.x), ys = all.map(p => p.y), x0 = Math.min(...xs), y1 = Math.max(...ys), w = Math.max(...xs) - x0 || 1, h = y1 - Math.min(...ys) || 1;
  const k = 4000 / Math.max(w, h), pad = 40, X = p => Math.round(((p.x - x0) * k + pad) * 10) / 10, Y = p => Math.round(((y1 - p.y) * k + pad) * 10) / 10;
  return { size: [Math.round(w * k + 2 * pad), Math.round(h * k + 2 * pad)], lines: segs.map(v => ["#000000", 1, v.flatMap(p => [X(p), Y(p)])]), texts: texts.filter(t => t[1]).map(([p, t, z]) => [X(p), Y(p), t, Math.max(4, Math.round(z * k))]) };
}
// D-11: add a print
function addPrintCard() {
  if (!gh.on()) { toast("Needs the GitHub key to upload a print (open from the Home Screen icon)"); return; }
  openCard(`<h2>Add a print</h2>
    <label class="f"><span>The print: a PDF, a picture, or a DXF</span><input type="file" id="ap-f" accept=".pdf,.dxf,image/*" style="font:inherit;font-size:16px;max-width:100%"></label>
    <label class="f"><span>Name</span><input type="text" id="ap-n" placeholder="For example: Fiber print, sheet 2" autocomplete="off"></label>
    <label class="f" id="ap-pl" hidden><span id="ap-pt">Which page of the PDF</span><input type="text" id="ap-p" inputmode="numeric" value="1" autocomplete="off"></label>
    <div class="acts"><button class="primary" id="ap-ok">Upload</button><button data-cancel id="ap-x">Cancel</button></div>`, "D-11");
  let pdf = null;
  $("ap-f").onchange = async () => {
    const f = $("ap-f").files[0]; pdf = null; $("ap-pl").hidden = true; if (!f) return;
    if (!$("ap-n").value.trim()) $("ap-n").value = f.name.replace(/\.[^.]+$/, "");
    if (/\.pdf$/i.test(f.name)) { try { pdf = await pdfPages(f); if (pdf.numPages > 1) { $("ap-pt").textContent = `Which page of the PDF (it has ${pdf.numPages})`; $("ap-pl").hidden = false; } } catch (e) { toast("Couldn't read the PDF: " + e.message); } }
  };
  $("ap-x").onclick = closeCard;
  $("ap-ok").onclick = async () => {
    const f = $("ap-f").files[0], name = $("ap-n").value.trim();
    if (!f) { toast("Pick the print first"); return; }
    if (!name) { toast("Give the print a name"); return; }
    const dxf = /\.dxf$/i.test(f.name), isPdf = /\.pdf$/i.test(f.name), page = Math.max(1, Math.min(pdf ? pdf.numPages : 1, parseInt($("ap-p").value, 10) || 1));
    const pid = uid(), t = Date.now(), path = `gps/prints/${slug}--${pid}.${dxf ? "json" : "jpg"}`;
    $("ap-ok").disabled = true; toast("Reading the print…");
    try {
      let rec, cache;
      if (dxf) {
        const pl = await dxfToPlan(await f.text());
        toast("Uploading the print…"); await putFile(path, b64(JSON.stringify(pl)), `Draw as-built: print "${name}" for ${projName}`);
        rec = { id: pid, name, kind: "dxf", path, size: pl.size, file: f.name, t }; cache = { t, plan: pl };
      } else {
        const pic = isPdf ? await pdfToJpeg(pdf || await pdfPages(f), page) : await imageToJpeg(f);
        toast("Uploading the print…"); await putFile(path, await blobB64(pic.blob), `Draw as-built: print "${name}" for ${projName}`);
        rec = { id: pid, name, kind: "pic", path, size: [pic.w, pic.h], file: f.name, t }; if (isPdf) rec.page = page; cache = { t, blob: pic.blob };
      }
      await idbSet(`print.${slug}.${pid}`, cache);
      mainDoc.prints = mainDoc.prints || []; mainDoc.prints.push(rec);
      mainDoc.sheets.push({ id: uid(), name, type: "all", print: pid });   // its first as-built: everything on it
      saveDoc(); closeCard(); renderList(); toast(`Print "${name}" added`);
    } catch (e) { $("ap-ok").disabled = false; toast("Couldn't upload the print: " + e.message); }
  };
}
function renamePrint(pr) {
  openCard(`<h2>Name this print</h2><label class="f"><span>Name</span><input type="text" id="rp-n" value="${esc(pr.name)}" autocomplete="off"></label>
    <div class="acts"><button class="primary" id="rp-ok">Save</button><button data-cancel id="rp-x">Cancel</button></div>`, "D-12");
  $("rp-ok").onclick = () => { const n = $("rp-n").value.trim(); if (!n) { toast("Type a name"); return; } pr.name = n; saveDoc(); closeCard(); renderList(); };

}

/* ---------------------------------------------------------------- the as-built list page (Steven 2026-11-20)
   Draw as-built opens here: the job's as-builts, tap one to work on it. Each has its own name. */
const sheetUrl = id => { const q = new URLSearchParams(location.search); if (id) q.set("s", id); else q.delete("s"); return location.pathname + "?" + q; };
function showList(replace) {
  sheet = null; sel = null; cur = null; mode = "view";
  $("list").hidden = false; $("wrap").hidden = $("tools").hidden = $("sel").hidden = $("hint").hidden = true;
  $("proj").textContent = projName;
  if (replace) history.replaceState(null, "", sheetUrl(null));
  renderList();
}
async function openSheet(id, push) {
  const sh = ((mainDoc && mainDoc.sheets) || []).find(x => x.id === id); if (!sh) { showList(true); return; }
  if (sh.print && !printRec(sh.print)) { toast("That print was deleted"); showList(true); return; }
  if ((sh.print || null) !== curPrint) { toast("Opening the print…"); await usePrint(sh.print || null); }
  sheet = sh; sel = null; cur = null;
  $("list").hidden = true; $("wrap").hidden = $("tools").hidden = false;
  $("proj").textContent = projName + " · " + sh.name;
  $("t-others").hidden = sh.type !== "pick";
  if (push) history.pushState({ sheet: id }, "", sheetUrl(id));
  view.fitted = false; planCache = null; W = 0; setMode("view"); resize();
}
window.addEventListener("popstate", () => {
  const id = new URLSearchParams(location.search).get("s");
  if (id && mainDoc && (mainDoc.sheets || []).some(x => x.id === id)) openSheet(id, false); else showList(false);
});
const printRec = id => ((mainDoc && mainDoc.prints) || []).find(p => p.id === id);
const printName = id => id ? ((printRec(id) || {}).name || "a deleted print") : "the job print";
function sheetSays(sh) {
  if (sh.type === "all") return "Everything on the drawing";
  if ((sh.print || null) !== curPrint && sh.type === "pick") return "Some icons and lines";
  if (sh.type === "bldg") return "Only this building" + (sh.rot ? ", turned to lie flat on the sheet" : "");
  const ks = kinds(), lks = lineKinds();
  const L = Object.keys(lks).filter(k => picks(sh, true, k)).map(k => lks[k].name), I = Object.keys(ks).filter(k => picks(sh, false, k)).map(k => ks[k].name);
  const all = [...L, ...I];
  return all.length ? "Shows " + all.join(", ") : "Nothing picked yet";
}

    ${S.map(sh => `<div class="sh"><button class="open" data-o="${esc(sh.id)}"><b>${esc(sh.name)}</b><span>${esc(sheetSays(sh))} · On ${esc(printName(sh.print))}</span></button>
      ${sh.type === "pick" ? `<button class="act" data-e="${esc(sh.id)}">What shows</button>` : ""}<button class="act" data-r="${esc(sh.id)}">Rename</button>${sh.type !== "all" ? `<button class="act danger" data-d="${esc(sh.id)}">Delete</button>` : ""}</div>`).join("")}
    <p class="small">The as-builts on one print are all the same drawing. A change on one shows on the others on that print too.</p>
    ${(mainDoc.prints || []).length ? `<h2>Extra prints</h2>${mainDoc.prints.map(pr => `<div class="sh"><span class="open" style="display:flex"><b>${esc(pr.name)}</b><span>${esc(pr.file || "")}${pr.page ? " · page " + pr.page : ""}</span></span>
      <button class="act" data-pr="${esc(pr.id)}">Rename</button><button class="act danger" data-pd="${esc(pr.id)}">Delete</button></div>`).join("")}` : ""}`;
  for (const b of el.querySelectorAll("[data-pr]")) b.onclick = () => renamePrint(printRec(b.dataset.pr));

  };
  $("l-print").onclick = addPrintCard;
  const find = id => S.find(x => x.id === id);

  for (const b of el.querySelectorAll("[data-r]")) b.onclick = () => renameSheet(find(b.dataset.r));
  for (const b of el.querySelectorAll("[data-e]")) b.onclick = async () => { const sh = find(b.dataset.e); if ((sh.print || null) !== curPrint) await usePrint(sh.print || null); pickEditor(sh, false); };
  for (const b of el.querySelectorAll("[data-d]")) b.onclick = () => {
    const sh = find(b.dataset.d);

}
function renameSheet(sh) {
  openCard(`<h2>Name this as-built</h2>
    <label class="f"><span>Name</span><input type="text" id="rn-n" value="${esc(sh.name)}" autocomplete="off"></label>
    <div class="acts"><button class="primary" id="rn-ok">Save</button><button data-cancel id="rn-x">Cancel</button></div>`, "D-8");
  const inp = $("rn-n"); setTimeout(() => { inp.focus(); inp.select(); }, 50);
  inp.onkeydown = e => { if (e.key === "Enter") $("rn-ok").click(); };
  $("rn-ok").onclick = () => { const n = inp.value.trim(); if (!n) { toast("Type a name"); return; } sh.name = n; saveDoc(); closeCard(); renderList(); };
  $("rn-x").onclick = closeCard;
}
// D-7: a new as-built: a name, then what it shows
function newSheet() {
  const bl = ((job && job.buildings) || []).filter(b => b.box && b.box[0] != null);
  openCard(`<h2>New as-built</h2>
    <label class="f"><span>Name (you can change it later)</span><input type="text" id="ns-n" placeholder="For example: Fiber, Building A" autocomplete="off"></label>
    ${(mainDoc.prints || []).length ? `<label class="f"><span>On which print</span><select id="ns-pr" style="font:inherit;font-size:18px;min-height:44px;width:100%;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"><option value="">The job print</option>${mainDoc.prints.map(pr => `<option value="${esc(pr.id)}">${esc(pr.name)}</option>`).join("")}</select></label>` : ""}
    <h3>What it shows</h3>
    <div class="list">${Object.entries(PRESETS).map(([k, v]) => `<button data-p="${k}">${esc(v.name)}</button>`).join("")}
      ${bl.length ? `<button data-p="bldg">One building, on its own sheet</button>` : ""}
      <button data-p="own">Pick my own icons and lines</button></div>
    <div class="acts"><button data-cancel id="ns-x">Cancel</button></div>`, "D-7");
  const nm = () => $("ns-n").value.trim(), onPr = () => ($("ns-pr") && $("ns-pr").value) || null;
  const withPr = sh => { const pr = onPr(); if (pr) sh.print = pr; return sh; };
  for (const b of $("card").querySelectorAll("[data-p]")) b.onclick = async () => {
    const k = b.dataset.p;
    if (k === "bldg" && onPr()) { toast("Building outlines are only on the job print"); return; }
    if (k === "bldg") {
      const typed = nm();
      openCard(`<h2>Which building?</h2><div class="chips">${bl.map((x, i) => `<button data-b="${i}">${esc(x.name)}</button>`).join("")}</div>
        <div class="acts"><button data-cancel id="nb-x">Back</button></div>`, "D-7");
      for (const c of $("card").querySelectorAll("[data-b]")) c.onclick = async () => { if (curPrint) await usePrint(null); const sh = bldgSheet(bl[+c.dataset.b]); if (typed) sh.name = typed; addSheet(sh); };
      $("nb-x").onclick = newSheet; return;
    }
    if (k === "own") { const pr = onPr(); if ((pr || null) !== curPrint) await usePrint(pr); pickEditor(withPr({ id: uid(), name: nm() || "My as-built", type: "pick", lines: [], icons: [] }), true); return; }
    addSheet(withPr(presetSheet(k, nm())));
  };
  $("ns-x").onclick = closeCard;
}
async function addSheet(sh) {
  if (!sh.print && curPrint && sh.type === "pick" && /aerial/i.test(sh.lineRx || "")) await usePrint(null);   // the pole line goes on the job print
  mainDoc.sheets = mainDoc.sheets || []; mainDoc.sheets.push(sh);
  if (!sh.print && doc === mainDoc && sh.type === "pick" && /aerial/i.test(sh.lineRx || "") && pullPoles()) { for (const i of doc.items) stamp(i); toast("Added the pole line from GPS Shots"); }
  saveDoc(); closeCard(); renderList();
}
// D-9: tick the icon and line types an as-built shows
function pickEditor(sh, isNew) {
  const ks = kinds(), lks = lineKinds();
  const row = (t, k, on) => `<label class="ck"><input type="checkbox" data-${t}="${k}"${on ? " checked" : ""}> ${esc(t === "l" ? lks[k].name : ks[k].name)}</label>`;
  openCard(`<h2>What shows on ${esc(sh.name)}</h2>
    ${isNew ? `<label class="f"><span>Name</span><input type="text" id="pe-n" value="${esc(sh.name)}" autocomplete="off"></label>` : ""}
    <h3>Lines</h3>${Object.keys(lks).map(k => row("l", k, picks(sh, true, k))).join("")}
    <h3>Icons</h3>${Object.keys(ks).map(k => row("i", k, picks(sh, false, k))).join("")}

  $("pe-ok").onclick = () => {

    sh.lines = [...$("card").querySelectorAll("[data-l]")].filter(c => c.checked).map(c => c.dataset.l);
    sh.icons = [...$("card").querySelectorAll("[data-i]")].filter(c => c.checked).map(c => c.dataset.i);

  };
  $("pe-x").onclick = closeCard;
}
const OM = { faded: "Others: faded", off: "Others: hidden" };
$("t-others").textContent = OM[othersMode] || OM.faded;
$("t-others").onclick = () => { othersMode = othersMode === "faded" ? "off" : "faded"; LS.set("draw.others", othersMode); $("t-others").textContent = OM[othersMode]; sel = null; renderSel(); draw(); };

load().then(() => {
  const id = new URLSearchParams(location.search).get("s");
  if (id && (mainDoc.sheets || []).some(x => x.id === id)) openSheet(id, false); else showList(true);
