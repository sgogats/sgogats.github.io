<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Draw As-built</title>
<style>
  :root { --bg:#f3f5f4; --panel:#ffffff; --ink:#14201b; --muted:#4a5852; --line:#d3dbd7; --accent:#0b6e4f; --accent-ink:#fff; --red:#c62828; --hi:#ffd200;
          --body:-apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#111417; --panel:#1d2227; --ink:#f1f4f6; --muted:#c3cbd2; --line:#3c454e; --accent:#3dbe8b; --accent-ink:#06130e; --red:#ff6b6b; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:16px/1.3 var(--body); overflow:hidden; }
  body { display:flex; flex-direction:column; height:100dvh; }
  button, a.btn { font:inherit; border:0; border-radius:10px; padding:10px 13px; min-height:44px; cursor:pointer; text-decoration:none;
                  background:var(--panel); color:var(--ink); border:1px solid var(--line); display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  button.danger { background:var(--red); color:#fff; border-color:var(--red); }
  button.on { outline:3px solid var(--accent); outline-offset:-3px; font-weight:600; }
  #bar { display:flex; align-items:center; gap:8px; padding:6px 10px; padding-top:max(6px, env(safe-area-inset-top)); background:var(--panel); border-bottom:1px solid var(--line); }
  #bar .ttl { flex:1; min-width:0; line-height:1.15; }
  #bar .ttl b { display:block; font-size:17px; white-space:nowrap; }
  #bar .ttl span { display:block; font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #bar .meta { text-align:right; font-size:12px; color:var(--muted); line-height:1.25; white-space:nowrap; max-width:42vw; overflow:hidden; text-overflow:ellipsis; }
  #bar .meta div { overflow:hidden; text-overflow:ellipsis; }
  #wrap { position:relative; flex:1; min-height:0; background:#fff; }
  #cv { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #hint { position:absolute; left:8px; right:8px; top:8px; background:var(--panel); color:var(--ink); border:2px solid var(--accent); border-radius:12px;
          padding:8px 10px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; box-shadow:0 2px 10px rgba(0,0,0,.18); }
  #hint-t { flex:1 1 220px; font-size:15px; }
  #hint .hb { display:flex; gap:6px; flex-wrap:wrap; }
  #hint button { min-height:38px; padding:6px 11px; }
  #sel { background:var(--panel); border-top:1px solid var(--line); padding:8px 10px; display:flex; flex-direction:column; gap:8px; }
  #sel .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #sel .nm { font-weight:700; font-size:17px; flex:1; }
  #sel input[type=range] { flex:1; min-width:120px; height:34px; }
  #sel select { font:inherit; min-height:44px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:0 8px; }
  #tools { display:flex; gap:6px; padding:8px 10px; padding-bottom:max(8px, env(safe-area-inset-bottom)); background:var(--panel); border-top:1px solid var(--line); flex-wrap:wrap; }
  #tools button { flex:1 0 auto; padding:8px 10px; }
  .small { font-size:13px; color:var(--muted); }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  #card { background:var(--panel); color:var(--ink); width:100%; max-width:640px; max-height:92dvh; overflow:auto; border-radius:16px 16px 0 0; padding:14px 14px max(14px, env(safe-area-inset-bottom)); position:relative; }
  @media (min-width:700px) { #modal { align-items:center; } #card { border-radius:16px; } }
  #card h2 { margin:0 0 4px; font-size:20px; padding-right:70px; }
  #card h3 { margin:14px 0 6px; font-size:15px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  #card .pg { position:absolute; top:10px; right:14px; font-size:12px; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(100px, 1fr)); gap:8px; }
  .grid button { flex-direction:column; padding:8px 4px; min-height:92px; font-size:14px; text-align:center; line-height:1.15; }
  .grid img { width:44px; height:44px; }
  .list { display:flex; flex-direction:column; gap:8px; }
  .list button { justify-content:flex-start; text-align:left; }
  .swl { display:inline-block; width:46px; height:0; border-top:5px solid; vertical-align:middle; }
  .acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .acts button { flex:1 1 auto; }
  label.f { display:block; margin-top:10px; }
  label.f span { display:block; font-size:14px; color:var(--muted); margin-bottom:4px; }
  label.f input[type=text] { width:100%; font:inherit; font-size:20px; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; max-height:30vh; overflow:auto; }
  .chips button { min-height:38px; padding:6px 10px; font-size:15px; }
  .sw { display:flex; flex-wrap:wrap; gap:6px; }
  .sw button { width:40px; height:40px; min-height:40px; padding:0; border-radius:50%; border:2px solid var(--line); }
  .sw button.on { outline:3px solid var(--ink); outline-offset:1px; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; }
  .preview { margin-top:10px; padding:10px; border-radius:10px; background:var(--bg); font-size:16px; }
  #toast { position:fixed; left:50%; bottom:110px; transform:translateX(-50%); background:#14201b; color:#fff; padding:10px 16px; border-radius:22px; z-index:30; font-size:15px; max-width:90vw; text-align:center; }
  #pg { position:absolute; right:6px; bottom:4px; font-size:11px; color:#666; background:rgba(255,255,255,.7); padding:1px 5px; border-radius:6px; pointer-events:none; }
</style>
</head>
<body>
<div id="bar">
  <a class="btn" id="back" href="./">Back</a>
  <div class="ttl"><b>Draw as-built</b><span id="proj">Loading…</span></div>
  <div class="meta"><div id="save"></div><div id="ver"></div></div>
</div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hint" hidden><span id="hint-t"></span><span class="hb" id="hint-b"></span></div>
  <div id="pg">Page D-1</div>
</div>
<div id="sel" hidden></div>
<div id="tools">
  <button class="primary" id="t-icon">Add icon</button>
  <button class="primary" id="t-line">Draw line</button>
  <button id="t-words">Move words</button>
  <button id="t-size">Icon size</button>
  <button id="t-undo">Undo</button>
  <button id="t-print">Print: faded</button>
  <button id="t-fit">Whole print</button>
  <button id="t-save">Save PDF 24x36</button>
</div>
<div id="modal" hidden><div id="card"></div></div>
<div id="toast" hidden></div>

<script>
"use strict";
/* Draw as-built (Steven 2026-10-08): his own as-built drawn by hand on the job's print, kept as a SEPARATE print from the
   GPS one. Saved in ASBUILT_MAKER gps/drawn/<slug>.json. Icon names are the same location names the designer and
   GPS Shots use: a typed name that matches one (18 for a lockbox = LB-18) is that location; any other becomes a new
   location GPS Shots lists and can plot (gpsName / gk / gg below are what GPS Shots reads). Lines start on one icon
   and end on another and stay attached when an icon moves. */
const APP_VERSION = "V 01.10";
// phones keep an old copy of this page for a while: load the newest one when it changes (same as GPS Shots)
(async () => {
  try {
    const r = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
    const m = (await r.text()).match(/APP_VERSION = "([^"]+)"/);
    if (m && m[1] !== APP_VERSION && sessionStorage.getItem("draw.upd") !== m[1]) {
      sessionStorage.setItem("draw.upd", m[1]); const q = new URLSearchParams(location.search); q.set("v", m[1]); location.replace(location.pathname + "?" + q);
    }
  } catch {}
})();
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem("gps." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("gps." + k, JSON.stringify(v)); return true; } catch { return false; } },
};
$("ver").textContent = APP_VERSION;
const slug = new URLSearchParams(location.search).get("p") || LS.get("current", "");
const cfg = Object.assign({ token: "", repo: "sgogats/ASBUILT_MAKER", branch: "main" }, LS.get("cfg", {}) || {});
$("back").href = "./";
$("back").onclick = e => { if (history.length > 1) { e.preventDefault(); history.back(); } };

function b64(str) { const bytes = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); return btoa(s); }
function decodeB64(s) { const bin = atob(s.replace(/\n/g, "")); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
const gh = {
  on() { return !!cfg.token; },
  url(path) { return `https://api.github.com/repos/${cfg.repo}/contents/${path.split("/").map(encodeURIComponent).join("/")}`; },
  headers(raw) { return { Authorization: "Bearer " + cfg.token, Accept: raw ? "application/vnd.github.raw+json" : "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }; },
  async get(path, raw) {
    const r = await fetch(this.url(path) + "?ref=" + encodeURIComponent(cfg.branch) + "&t=" + Date.now(), { headers: this.headers(raw), cache: "no-store" });
    if (r.status === 404) return null;
    if (!r.ok) { const e = new Error("GitHub said " + r.status); e.status = r.status; throw e; }
    return raw === "blob" ? r.blob() : r.json();
  },
  async put(path, obj, sha, message) {
    const body = { message, branch: cfg.branch, content: b64(JSON.stringify(obj, null, 1)) };
    if (sha) body.sha = sha;
    const r = await fetch(this.url(path), { method: "PUT", headers: this.headers(false), body: JSON.stringify(body) });
    if (!r.ok) { const e = new Error("GitHub said " + r.status); e.status = r.status; throw e; }
    return r.json();
  },
};
const idbGet = k => new Promise(ok => { try { const q = indexedDB.open("gps", 1); q.onupgradeneeded = () => q.result.createObjectStore("kv"); q.onerror = () => ok(null);
  q.onsuccess = () => { try { const g = q.result.transaction("kv").objectStore("kv").get(k); g.onsuccess = () => ok(g.result || null); g.onerror = () => ok(null); } catch { ok(null); } }; } catch { ok(null); } });

let toastT = null;
function toast(t) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }

/* ---------------------------------------------------------------- icons and line types
   Steven's own: blue rectangle = vault, red triangle = lockbox, circle with X = pole, circle with X and a small R circle = riser pole,
   orange line = 2" conduit, gray line = 1" conduit. Electric / water / cable TV follow the usual utility map symbols and
   colors (red electric, blue water, orange cable TV). Every one can be renamed and recolored; renames are kept per job. */
const GROUPS = ["Telecom", "Electric", "Water", "Cable TV", "My icons"];
const DEF_KINDS = {
  vault:   { name: "Vault", color: "#1f5fd6", shape: "rect", grp: "Telecom", gk: "Lockbox vault", gg: "Vaults, cans and poles", match: ["Lockbox vault", "Vault", "Can", "Main", "MDU entry"], pre: "v" },
  lockbox: { name: "Lockbox", color: "#d62828", shape: "tri", grp: "Telecom", gk: "Lockbox", gg: "Added in field", match: ["Lockbox"], pre: "lb" },
  pole:    { name: "Pole", color: "#222222", shape: "pole", grp: "Telecom", gk: "Pole line", gg: "Pole line", match: ["Pole line", "Pole"], pre: "" },
  riser:   { name: "Riser pole", color: "#222222", shape: "riser", grp: "Telecom", gk: "Riser pole", gg: "Vaults, cans and poles", match: ["Riser pole"], pre: "rp" },
  ped:     { name: "Pedestal", color: "#4b5563", shape: "ped", grp: "Telecom", gk: "Pedestal", gg: "Pedestal", match: ["Pedestal"] },
  nid:     { name: "NID panel", color: "#1f6feb", shape: "box", letter: "NID", grp: "Telecom", gk: "NID panel", gg: "NID panels" },
  xfmr:    { name: "Transformer", color: "#c1121f", shape: "box", letter: "T", grp: "Electric" },
  emeter:  { name: "Electric meter", color: "#c1121f", shape: "circ", letter: "M", grp: "Electric" },
  ebox:    { name: "Electric handhole", color: "#c1121f", shape: "box", letter: "E", grp: "Electric" },
  light:   { name: "Light pole", color: "#c1121f", shape: "light", grp: "Electric" },
  wvalve:  { name: "Water valve", color: "#1565c0", shape: "valve", grp: "Water" },
  hydrant: { name: "Fire hydrant", color: "#1565c0", shape: "hydrant", grp: "Water" },
  wmeter:  { name: "Water meter", color: "#1565c0", shape: "box", letter: "W", grp: "Water" },
  tvped:   { name: "Cable TV pedestal", color: "#e07000", shape: "box", letter: "TV", grp: "Cable TV" },
  tvamp:   { name: "Cable TV amplifier", color: "#e07000", shape: "amp", grp: "Cable TV" },
  tvtap:   { name: "Cable TV tap", color: "#e07000", shape: "circ", letter: "T", grp: "Cable TV" },
};
const SHAPES = { rect: "Rectangle", tri: "Triangle", pole: "Circle with X", riser: "Riser pole", ped: "Pedestal", box: "Box with letters",
                 circ: "Circle with letters", valve: "Valve", hydrant: "Hydrant", amp: "Amplifier", light: "Light", dot: "Dot", diamond: "Diamond" };
const DEF_LINES = {
  c2:    { name: '2" conduit', color: "#f28c28", w: 3.5, dash: "" },
  c1:    { name: '1" conduit', color: "#8a8f98", w: 3, dash: "" },
  elec:  { name: "Electric", color: "#c1121f", w: 3, dash: "dash" },
  water: { name: "Water", color: "#1565c0", w: 3, dash: "dash" },
  tv:    { name: "Cable TV", color: "#e07000", w: 3, dash: "dot" },
};
const COLORS = ["#d62828", "#c1121f", "#f28c28", "#e07000", "#f2c500", "#2e9d4f", "#0b6e4f", "#1f5fd6", "#1565c0", "#7b3fbf", "#8a8f98", "#4b5563", "#6d4c41", "#222222"];
const DASH = { "": [], dash: [12, 6], dot: [3, 5] };

let doc = null;           // the drawing
let plan = null, ppf = 0, projName = slug, names = [];   // print, print points per foot, location names shared with the designer / GPS Shots
let kCache = null, lCache = null;
const kinds = () => { if (kCache) return kCache; const o = kCache = {}; for (const [k, v] of Object.entries(DEF_KINDS)) o[k] = Object.assign({}, v, (doc.kinds || {})[k]); for (const [k, v] of Object.entries(doc.kinds || {})) if (!o[k]) o[k] = Object.assign({ grp: "My icons" }, v); return o; };
const lineKinds = () => { if (lCache) return lCache; const o = lCache = {}; for (const [k, v] of Object.entries(DEF_LINES)) o[k] = Object.assign({}, v, (doc.lineKinds || {})[k]); for (const [k, v] of Object.entries(doc.lineKinds || {})) if (!o[k]) o[k] = Object.assign({ w: 3, dash: "" }, v); return o; };
const kindOf = it => kinds()[it.k] || { name: "Icon", color: "#444", shape: "dot" };
function label(it) {   // Steven: type 18 for a lockbox and the print says "Lockbox 18"
  const kn = kindOf(it).name, n = String(it.name || "").trim();
  if (!n) return kn;
  return n.toLowerCase().startsWith(kn.toLowerCase()) ? n : kn + " " + n;
}
const newDoc = () => ({ project: projName, slug, v: 1, updated: 0, kinds: {}, lineKinds: {}, items: [], lines: [] });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ---------------------------------------------------------------- shared names (designer + GPS Shots) */
const sq = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
function nameKey(n, pre) {   // "Lockbox 18", "LB-18" and 18 (typed for a lockbox) are the same location
  let s = String(n || "").trim().toLowerCase();
  s = s.replace(/^lock\s*box\b/, "lb").replace(/^riser\s*pole\b/, "rp").replace(/^vault\b/, "v").replace(/^pole\b/, "");
  s = sq(s);
  if (pre && /^[0-9]/.test(s)) s = pre + s;
  return s;
}
function findName(it) {   // the designer / GPS location this icon is, or null when it is a new one
  const kd = kindOf(it), typed = String(it.name || "").trim(); if (!typed) return null;
  const exact = names.find(n => n.name === typed); if (exact) return exact.name;
  const pre = kd.pre, k1 = nameKey(typed, pre), k2 = nameKey(label(it), pre);
  const same = n => { const k = nameKey(n.name, pre); return k === k1 || k === k2; };
  const typedKind = names.filter(n => (kd.match || []).includes(n.kind));
  const hit = typedKind.find(same) || (kd.match ? null : names.find(same));
  return hit ? hit.name : null;
}
function stamp(it) {   // what GPS Shots reads: the location name, its kind and its list
  const kd = kindOf(it);
  it.gpsName = findName(it) || label(it);
  it.gk = kd.gk || kd.name; it.gg = kd.gg || kd.name;
}

/* ---------------------------------------------------------------- view */
const cv = $("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, TOP = null;
const view = { x: 0, y: 0, s: 1, fitted: false };
const toScreen = p => ({ x: p.x * view.s + view.x, y: p.y * view.s + view.y });
const toPrint = p => ({ x: (p.x - view.x) / view.s, y: (p.y - view.y) / view.s });
function bounds() {
  if (plan && plan.size) { const [ox, oy] = plan.origin || [0, 0]; return { x0: ox, y0: oy, x1: ox + plan.size[0], y1: oy + plan.size[1] }; }
  const pts = doc.items.length ? doc.items : [{ x: 0, y: 0 }];
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  return { x0: Math.min(...xs) - 200, y0: Math.min(...ys) - 200, x1: Math.max(...xs) + 200, y1: Math.max(...ys) + 200 };
}
function fit() {
  const b = bounds(), pad = 10;
  view.s = Math.min((W - 2 * pad) / (b.x1 - b.x0), (H - 2 * pad) / (b.y1 - b.y0));
  view.x = (W - (b.x1 - b.x0) * view.s) / 2 - b.x0 * view.s; view.y = (H - (b.y1 - b.y0) * view.s) / 2 - b.y0 * view.s;
  view.fitted = true;
}
function resize() {
  const r = $("wrap").getBoundingClientRect(); DPR = Math.min(window.devicePixelRatio || 1, 3);
  if (TOP != null && r.top !== TOP) view.y -= r.top - TOP;   // the top bar grew or shrank: keep the print still on the screen
  TOP = r.top;
  if (r.width === W && r.height === H) { draw(); return; }
  W = r.width; H = r.height; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  planCache = null; if (!view.fitted || !doc) { if (doc) fit(); }
  draw();
}
new ResizeObserver(resize).observe($("wrap"));

/* ---------------------------------------------------------------- drawing */
let printMode = LS.get("draw.print", "faded");   // normal / faded / off
/* Steven 2026-10-08: icons are part of the print, so they grow and shrink with it when zooming. Their size is set once
   per print with "Icon size" (asked after the first icon is placed) and kept in doc.iconSize (half-size in print units). */
const ICON = 6;
const iconSize = () => (doc && doc.iconSize) || ICON;
const iconPx = s => Math.max(1.5, iconSize() * s);
let planPaths = null, planCache = null;
function planGroups() {
  if (planPaths && planPaths.plan === plan) return planPaths.g;
  const m = new Map();
  for (const [col, w, pts] of plan.lines || []) {
    const k = col + "|" + w; let e = m.get(k); if (!e) { e = { col, w, p: new Path2D() }; m.set(k, e); }
    e.p.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) e.p.lineTo(pts[i], pts[i + 1]);
  }
  planPaths = { plan, g: [...m.values()] }; return planPaths.g;
}
/* Steven 2026-10-08: street names (and any other words on the print) can be moved on this drawing only.
   Letters stacked one above the other (R I V E R B E N D) move together as one word. Moves are kept in doc.textMoves {key: [dx, dy]}. */
let tgCache = null;
function textGroups() {
  if (tgCache && tgCache.plan === plan) return tgCache.g;
  const T = (plan && plan.texts) || [], g = [];
  for (let i = 0; i < T.length; i++) {
    const t = T[i], last = g[g.length - 1], lt = last && T[last.idx[last.idx.length - 1]];
    const stacked = lt && String(t[2]).length === 1 && String(lt[2]).length === 1 && t[4] === lt[4] && t[3] === lt[3] && Math.abs(t[0] - lt[0]) < t[3] * 0.4 && t[1] > lt[1] && t[1] - lt[1] < t[3] * 2.4;
    if (stacked) last.idx.push(i); else g.push({ key: i + "|" + t[2], idx: [i] });
  }
  for (const w of g) {   // a box around the word, in print units

  const inp = $("nd-n");
  const upd = () => {
    const t = { k: it.k, name: inp.value.trim() }, link = findName(t);
    $("nd-p").innerHTML = t.name ? `On the print: <b>${esc(label(t))}</b><br><span class="small">${link ? (link === label(t) ? "Same location as in GPS Shots" : "Same location as <b>" + esc(link) + "</b> in the designer and GPS Shots") : "New location. GPS Shots will list it so you can GPS it."}</span>` : `<span class="small">Type the name. The print shows the type and the name, like “${esc(kd.name)} 18”.</span>`;
    if ($("nd-c")) { const q = sq(t.name);
      $("nd-c").innerHTML = mine.filter(n => !q || sq(n.name).includes(q)).slice(0, 60).map(n => `<button data-n="${esc(n.name)}"${taken.has(n.name) ? ' style="opacity:.5"' : ""}>${esc(n.name)}</button>`).join("");
      for (const b of $("nd-c").querySelectorAll("[data-n]")) b.onclick = () => { inp.value = b.dataset.n; upd(); }; }
  };
  inp.oninput = upd; upd(); setTimeout(() => inp.focus(), 50);
  inp.onkeydown = e => { if (e.key === "Enter") $("nd-ok").click(); };
  $("nd-ok").onclick = () => {
    const n = inp.value.trim(); if (!n) { toast("Type a name or number"); return; }
    if (!isNew) before();
    it.name = n; closeCard();
    if (isNew && !doc.iconSize) { doc.iconSize = ICON; changed(); setMode("size"); sel = null; return; }   // first icon on this print: set how big icons are
    if (isNew) { setMode("view"); sel = { type: "icon", id: it.id }; toast(`${label(it)} placed. Turn it below or drag it.`); }
    changed();
  };
  $("nd-x").onclick = () => {
    closeCard();
    if (isNew) { doc.items = doc.items.filter(i => i !== it); undo.pop(); draw(); }
  };
}

// D-5: pick a line type and how to draw it (or edit the types)
let editLines = false;
function linePicker() {
  const lks = lineKinds();
  const sw = v => `<span class="swl" style="border-top-color:${v.color};border-top-style:${v.dash === "dot" ? "dotted" : v.dash === "dash" ? "dashed" : "solid"}"></span>`;
  openCard(`<h2>${editLines ? "Tap a line to rename or recolor it" : "Pick a line"}</h2>
    <div class="list">${Object.entries(lks).map(([k, v]) => `<button data-k="${k}" class="${!editLines && k === lineKind ? "on" : ""}">${sw(v)} ${esc(v.name)}</button>`).join("")}</div>
    ${editLines ? "" : `<h3>How to draw it</h3><div class="seg"><button data-st="free" class="${lineStyle === "free" ? "on" : ""}">Freehand with finger</button><button data-st="dots" class="${lineStyle === "dots" ? "on" : ""}">Dot to dot</button></div>
    <p class="small">Lines always start on one icon and end on another, and stay attached when you move an icon.</p>`}
    <div class="acts">${editLines ? `<button id="lp-new">+ New line</button>` : ""}<button id="lp-edit">${editLines ? "Done editing" : "Rename / color"}</button><button data-cancel id="lp-x">Close</button></div>`, "D-5");
  for (const b of $("card").querySelectorAll("[data-st]")) b.onclick = () => { lineStyle = b.dataset.st; LS.set("draw.ls", lineStyle); linePicker(); };
  for (const b of $("card").querySelectorAll("[data-k]")) b.onclick = () => {
    if (editLines) { lineEditor(b.dataset.k); return; }
    lineKind = b.dataset.k; LS.set("draw.lk", lineKind); closeCard(); setMode("line");
  };
  $("lp-edit").onclick = () => { editLines = !editLines; linePicker(); };
  $("lp-x").onclick = closeCard;
  if (editLines) $("lp-new").onclick = () => lineEditor(null);
}
$("t-line").onclick = () => { if (mode === "line") { setMode("view"); return; } editLines = false; linePicker(); };

// D-6: rename / recolor a line type, or make a new one
function lineEditor(k) {
  const lks = lineKinds(), base = DEF_LINES[k], v = Object.assign({ name: "", color: "#2e9d4f", w: 3, dash: "" }, k ? lks[k] : {});
  const used = k ? doc.lines.filter(l => l.k === k).length : 0;
  const prev = () => { const c = document.createElement("canvas"); c.width = 440; c.height = 40; const g = c.getContext("2d"); g.scale(2, 2);
    paintLine(g, [{ x: 10, y: 10 }, { x: 210, y: 10 }], v, 1, false); $("le-prev").innerHTML = `<img alt="" src="${c.toDataURL()}" style="width:220px;height:20px;vertical-align:middle"> <b>${esc(v.name || "New line")}</b>`;
    $("le-sw").innerHTML = COLORS.map(c => `<button data-c="${c}" class="${c === v.color ? "on" : ""}" style="background:${c}" aria-label="${c}"></button>`).join("") + `<input type="color" id="le-c" value="${v.color}" style="width:46px;height:40px;border:0;background:none">`;
    for (const b of $("le-sw").querySelectorAll("[data-c]")) b.onclick = () => { v.color = b.dataset.c; prev(); };
    $("le-c").oninput = e => { v.color = e.target.value; prev(); };
    for (const b of $("card").querySelectorAll("[data-d]")) b.classList.toggle("on", b.dataset.d === v.dash); };
  openCard(`<h2>${k ? "Edit " + esc(lks[k].name) : "New line"}</h2>
    <label class="f"><span>Name</span><input type="text" id="le-n" value="${esc(v.name)}" autocomplete="off"></label>
    <label class="f"><span>Color</span></label><div class="sw" id="le-sw"></div>
    <label class="f"><span>Style</span></label><div class="seg"><button data-d="">Solid</button><button data-d="dash">Dashes</button><button data-d="dot">Dots</button></div>
    <div class="preview" id="le-prev"></div>
    <div class="acts"><button class="primary" id="le-ok">Save</button>${base && (doc.lineKinds || {})[k] ? `<button id="le-reset">Put back original</button>` : ""}${!base && k ? `<button class="danger" id="le-del">Delete line type</button>` : ""}<button data-cancel id="le-x">Cancel</button></div>`, "D-6");
  prev();
  $("le-n").oninput = e => { v.name = e.target.value; prev(); };
  for (const b of $("card").querySelectorAll("[data-d]")) b.onclick = () => { v.dash = b.dataset.d; prev(); };
  $("le-x").onclick = linePicker;
  $("le-ok").onclick = () => {
    const name = v.name.trim(); if (!name) { toast("Give it a name"); return; }
    before(); doc.lineKinds = doc.lineKinds || {}; doc.lineKinds[k || "my-" + uid()] = { name, color: v.color, w: v.w || 3, dash: v.dash }; changed(); linePicker();
  };
  if ($("le-reset")) $("le-reset").onclick = () => { before(); delete doc.lineKinds[k]; changed(); linePicker(); };
  if ($("le-del")) $("le-del").onclick = () => { if (used) { toast(`${used} line${used > 1 ? "s use" : " uses"} it. Delete those first.`); return; } before(); delete doc.lineKinds[k]; changed(); linePicker(); };
}

/* ---------------------------------------------------------------- print on/off, fit, picture */
const PM = { normal: "Print: normal", faded: "Print: faded", off: "Print: hidden" };
$("t-print").textContent = PM[printMode] || PM.faded;
$("t-print").onclick = () => { printMode = printMode === "faded" ? "off" : printMode === "off" ? "normal" : "faded"; LS.set("draw.print", printMode); $("t-print").textContent = PM[printMode]; planCache = null; draw(); };
$("t-words").onclick = () => { if (!plan || !(plan.texts || []).length) { toast("This print has no words to move"); return; } setMode(mode === "words" ? "view" : "words"); };
$("t-size").onclick = () => setMode(mode === "size" ? "view" : "size");
$("t-fit").onclick = () => { fit(); draw(); };
/* Steven 2026-10-08: Save PDF makes a 24 x 36 inch sheet (the drawing, a title line and a legend of what is used). */
const JSPDF = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
const loadScript = src => new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("couldn't load " + src)); document.head.appendChild(s); });
$("t-save").onclick = async () => {
  if (!doc) return;
  toast("Making the 24 x 36 PDF…");
  const b = bounds(), bw = b.x1 - b.x0, bh = b.y1 - b.y0, land = bw >= bh;
  const DPI = 120, PW = (land ? 36 : 24) * DPI, PH = (land ? 24 : 36) * DPI, M = DPI / 2, head = DPI;   // half-inch margins, one-inch title band
  const k = Math.min((PW - 2 * M) / bw, (PH - 2 * M - head) / bh), ox = (PW - bw * k) / 2, oy = M + head + (PH - 2 * M - head - bh * k) / 2;
  const c = document.createElement("canvas"); c.width = PW; c.height = PH; const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, PW, PH);
  g.strokeStyle = "#111"; g.lineWidth = 4; g.strokeRect(M / 2, M / 2, PW - M, PH - M);
  g.fillStyle = "#111"; g.font = "700 56px sans-serif"; g.textBaseline = "middle"; g.textAlign = "left";
  g.fillText(`${projName} · As-built`, M, M + head / 2);
  g.textAlign = "right"; g.font = "500 40px sans-serif"; g.fillText(new Date().toLocaleDateString(), PW - M, M + head / 2);
  g.save(); g.translate(ox, oy); g.scale(k, k); g.translate(-b.x0, -b.y0); paintPlan(g, k, printMode === "off" ? 0 : printMode === "faded" ? 0.4 : 1); g.restore();
  const T = p => ({ x: (p.x - b.x0) * k + ox, y: (p.y - b.y0) * k + oy }), z = iconSize() * k, wm = Math.max(0.2, z * 0.11), lks = lineKinds();
  for (const ln of doc.lines) paintLine(g, linePts(ln).map(T), lks[ln.k] || DEF_LINES.c2, wm, false);
  for (const it of doc.items) paintIcon(g, it, T(it), z, false);
  for (const it of doc.items) paintLabel(g, it, T(it), z, z * 1.05);
  if (ppf) {   // scale bar
    const per = k * ppf; let ft = 10; for (const f of [10, 20, 25, 50, 100, 200, 250, 500]) { ft = f; if (f * per >= DPI * 2) break; }
    const x = M, y = PH - M - 30, w = ft * per;
    g.strokeStyle = "#111"; g.lineWidth = 6; g.beginPath(); g.moveTo(x, y - 24); g.lineTo(x, y); g.lineTo(x + w, y); g.lineTo(x + w, y - 24); g.stroke();
    g.fillStyle = "#111"; g.font = "600 40px sans-serif"; g.textAlign = "left"; g.textBaseline = "alphabetic"; g.fillText(ft + " ft", x + w + 16, y);
  }
  const usedK = [...new Set(doc.items.map(i => i.k))], usedL = [...new Set(doc.lines.map(l => l.k))], rows = usedK.length + usedL.length;
  if (rows) {   // legend, bottom right
    const lh = 70, w = 700, h = rows * lh + 30, x = PW - M - w, y = PH - M - h;
    g.fillStyle = "rgba(255,255,255,.95)"; g.strokeStyle = "#111"; g.lineWidth = 3; g.fillRect(x, y, w, h); g.strokeRect(x, y, w, h);
    let yy = y + 15 + lh / 2; g.font = "600 40px sans-serif"; g.textAlign = "left"; g.textBaseline = "middle";
    for (const kk of usedK) { const kd = kinds()[kk]; if (!kd) continue; g.save(); g.translate(x + 60, yy); iconShape(g, kd, 22); g.restore(); g.fillStyle = "#111"; g.fillText(kd.name, x + 120, yy); yy += lh; }
    for (const lk of usedL) { const v = lks[lk]; if (!v) continue; paintLine(g, [{ x: x + 20, y: yy }, { x: x + 100, y: yy }], v, 2, false); g.fillStyle = "#111"; g.fillText(v.name, x + 120, yy); yy += lh; }
  }
  try {
    if (!window.jspdf) await loadScript(JSPDF);
    const pdf = new window.jspdf.jsPDF({ orientation: land ? "landscape" : "portrait", unit: "in", format: [24, 36] });
    pdf.addImage(c.toDataURL("image/jpeg", 0.9), "JPEG", 0, 0, land ? 36 : 24, land ? 24 : 36);
    const blob = pdf.output("blob"), fname = `${slug}-as-built-24x36.pdf`, file = new File([blob], fname, { type: "application/pdf" });
    try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: projName + " as-built" }); return; } } catch (e) { if (e.name === "AbortError") return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    toast("PDF saved (24 x 36)");
  } catch (e) { toast("Couldn't make the PDF: " + e.message); }
};

load();
</script>
