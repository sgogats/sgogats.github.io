<!doctype html>
<html lang="en">

<title>3D Site</title>
<style>
  :root { --bg:#eef1f4; --bar:#ffffff; --ink:#1d2733; --muted:#5b6876; --btn:#1f6feb; --line:#d6dce3; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#12161b; --bar:#1b2128; --ink:#e6edf3; --muted:#9aa7b4; --btn:#2f81f7; --line:#2c343d; }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:16px/1.3 -apple-system, system-ui, sans-serif; overflow:hidden; }
  #bar { position:fixed; top:0; left:0; right:0; z-index:5; background:var(--bar); border-bottom:1px solid var(--line);
         padding:8px 12px; padding-top:max(8px, env(safe-area-inset-top)); display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  #bar h1 { font-size:17px; margin:0 4px 0 0; }
  #bar .ver { color:var(--muted); font-size:13px; }
  a.back, button { background:var(--btn); color:#fff; border:0; border-radius:8px; padding:9px 12px; font-size:15px; text-decoration:none; cursor:pointer; }
  button.plain { background:transparent; color:var(--btn); border:1px solid var(--line); }
  button.on { background:var(--btn); color:#fff; }
  .count { display:flex; align-items:center; gap:6px; }

  #view { position:fixed; inset:0; touch-action:none; }
  #msg { position:fixed; left:12px; right:12px; bottom:12px; z-index:5; background:var(--bar); border:1px solid var(--line);
         border-radius:10px; padding:10px 12px; font-size:15px; }
  #key { display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; font-size:14px; }
  #key i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  #page { position:fixed; right:10px; bottom:10px; z-index:6; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div id="bar">
  <a class="back" href="./" onclick="if (history.length > 1) { history.back(); return false; }">Back</a>
  <h1 id="title">3D Site</h1><span class="ver" id="ver"></span>
  <button class="plain on" id="under">See underground</button>
  <span class="count">Stretch heights <button class="plain" id="sless">−</button><b id="spread">3x</b><button class="plain" id="smore">+</button></span>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

const APP_VERSION = "V 01.05";
const $ = id => document.getElementById(id);
$("ver").textContent = APP_VERSION;
const say = html => { $("msg").innerHTML = html; };

// Heights from Steven (inches, from the ground). Townhouses are 3 stories but only the 1st-floor print exists, so one story is drawn.
const IN = 1 / 12;
const H = { nid: 48 * IN, lockbox: 16 * IN, fiber: -36 * IN, vaultDepth: 36 * IN, townhouse: 10 };

// ---------------------------------------------------------------- data (same GitHub key as GPS Shots)
let cfg = {}; try { cfg = JSON.parse(localStorage.getItem("gps.cfg") || "{}") || {}; } catch {}
cfg = Object.assign({ repo: "sgogats/ASBUILT_MAKER", branch: "main" }, cfg);
async function gh(path) {
  const url = `https://api.github.com/repos/${cfg.repo}/contents/${path.split("/").map(encodeURIComponent).join("/")}?ref=${encodeURIComponent(cfg.branch)}&t=${Date.now()}`;
  const r = await fetch(url, { headers: { Authorization: "Bearer " + cfg.token, Accept: "application/vnd.github.raw+json" }, cache: "no-store" });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(r.status === 401 ? "GitHub key was refused." : "GitHub said " + r.status);
  return r.json();
}
const SEEDS = { "garden-homes-unilever-englewood-cliffs": "town homes/garden_homes_seed.json" };   // designer data: conduit runs, NIDs

// ---------------------------------------------------------------- scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
$("view").appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(matchMedia("(prefers-color-scheme: dark)").matches ? 0x12161b : 0xdde6ee);
const camera = new THREE.PerspectiveCamera(45, 1, 0.5, 20000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.95;      // can look up from under the ground
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(300, 600, 200); scene.add(sun);
let site = new THREE.Group(); scene.add(site);
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

let job = null, seed = null, readings = null, stretch = 3, seeUnder = true, groundMat = null, W = 0, D = 0;

function planCanvas(plan) {
  const [pw, ph] = plan.size, s = Math.min(3, 4096 / Math.max(pw, ph));
  const c = document.createElement("canvas"); c.width = pw * s; c.height = ph * s;
  const g = c.getContext("2d"); g.fillStyle = "#fbfaf5"; g.fillRect(0, 0, c.width, c.height);
  g.scale(s, s); g.lineCap = g.lineJoin = "round";
  for (const [col, w, p] of plan.lines || []) {
    g.strokeStyle = col; g.lineWidth = Math.max(w, 0.5); g.beginPath(); g.moveTo(p[0], p[1]);
    for (let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]);
    g.stroke();
  }
  for (const [x, y, t, size, col, rot] of plan.texts || []) {
    g.save(); g.translate(x, y); if (rot) g.rotate(-rot * Math.PI / 180);
    g.fillStyle = col || "#333"; g.font = `${size || 8}px sans-serif`; g.fillText(t, 0, 0); g.restore();
  }
  return c;
}

let labelH = 4;
function label(text, color = "#1d2733") {
  const c = document.createElement("canvas"), g = c.getContext("2d"), size = 40;
  g.font = `bold ${size}px sans-serif`; c.width = Math.ceil(g.measureText(text).width) + 20; c.height = size + 16;
  g.font = `bold ${size}px sans-serif`; g.fillStyle = "rgba(255,255,255,0.85)"; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = color; g.textBaseline = "middle"; g.fillText(text, 10, c.height / 2);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  sp.scale.set(c.width / c.height * labelH, labelH, 1); sp.renderOrder = 10; return sp;
}
function tube(a, b, r, mat) {
  const len = a.distanceTo(b); if (len < 0.01) return new THREE.Group();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 8), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  return m;
}

// ---------------------------------------------------------------- build the site
function build() {
  scene.remove(site); site = new THREE.Group(); scene.add(site);
  const ppf = (seed && seed.project && seed.project.pt_per_ft) || job.pt_per_ft || 1.44;   // print points per foot
  const [pw, ph] = (job.plan && job.plan.size) || [1560, 1400];
  W = pw / ppf; D = ph / ppf; labelH = Math.max(3, W / 90);
  const at = (x, y, h = 0) => new THREE.Vector3(x / ppf - W / 2, h * stretch, y / ppf - D / 2);

  // ground = the site print laid flat
  const tex = job.plan ? new THREE.CanvasTexture(planCanvas(job.plan)) : null;
  if (tex) { tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = renderer.capabilities.getMaxAnisotropy(); }
  groundMat = new THREE.MeshBasicMaterial({ map: tex, color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: seeUnder ? 0.55 : 1, depthWrite: !seeUnder });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(W, D), groundMat); ground.rotation.x = -Math.PI / 2; site.add(ground);

  // where things are: the placed spot from GPS Shots wins, else the designed spot
  const ctl = (readings && readings.controls) || {};
  const spot = {};
  for (const it of job.items || []) spot[it.name] = { x: it.x, y: it.y, kind: it.kind };
  for (const v of (seed && seed.vaults) || []) spot[v.name] = spot[v.name] || { x: v.x, y: v.y, kind: v.kind };
  for (const l of (seed && seed.lockboxes) || []) spot[l.name] = spot[l.name] || { x: l.x, y: l.y, kind: "Lockbox" };
  for (const [n, c] of Object.entries(ctl)) if (spot[n] && c && c.use !== false && c.x != null) Object.assign(spot[n], { x: c.x, y: c.y });

  // buildings: the real outline drawn on the print (the thick wall line), not the designer's rough box
  const lines = (job.plan && job.plan.lines) || [];
  const bbOf = p => { let a = 1e9, b = 1e9, c = -1e9, d = -1e9; for (let i = 0; i < p.length; i += 2) { a = Math.min(a, p[i]); c = Math.max(c, p[i]); b = Math.min(b, p[i + 1]); d = Math.max(d, p[i + 1]); } return [a, b, c, d]; };
  const overlap = (a, b) => Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])) * Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
  const outlines = lines.filter(([c, w, p]) => c === "#282828" && Math.abs(w - 2.04) < 0.01 && p.length >= 8);
  const dashes = lines.filter(([c, w, p]) => c === "#282828" && Math.abs(w - 1.44) < 0.01 && p.length === 4);
  const inPoly = (x, y, P) => { let o = false; for (let i = 0, j = P.length - 1; i < P.length; j = i++) { const [xi, yi] = P[i], [xj, yj] = P[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) o = !o; } return o; };
  const bldg = {};                               // name -> {poly, outer: segs, party: segs, c: centre}
  for (const b of job.buildings || []) {
    const box = b.box || (b.x0 != null ? [b.x0, b.y0, b.x1, b.y1] : null); if (!box || box.some(v => v == null)) continue;
    const bx = [Math.min(box[0], box[2]), Math.min(box[1], box[3]), Math.max(box[0], box[2]), Math.max(box[1], box[3])];
    let best = null, bo = 0;
    for (const o of outlines) { const v = overlap(bbOf(o[2]), bx); if (v > bo) { bo = v; best = o; } }
    let poly;
    if (best && bo > 0.5 * (bx[2] - bx[0]) * (bx[3] - bx[1])) {
      const p = best[2]; poly = []; for (let i = 0; i < p.length; i += 2) poly.push([p[i], p[i + 1]]);
      const gap = Math.hypot(poly[0][0] - poly[poly.length - 1][0], poly[0][1] - poly[poly.length - 1][1]);
      if (gap < 0.5) poly.pop();
      else if (gap > 15) {                       // outline drawn in pieces: wrap all the wall lines of this building instead
        const ob = bbOf(p), pts = [];
        for (const [c, w, q] of lines) if (c === "#282828" && (Math.abs(w - 2.04) < 0.01 || Math.abs(w - 1.04) < 0.01)) {
          const qb = bbOf(q); if (qb[0] >= ob[0] - 15 && qb[2] <= ob[2] + 15 && qb[1] >= ob[1] - 15 && qb[3] <= ob[3] + 15) for (let i = 0; i < q.length; i += 2) pts.push([q[i], q[i + 1]]);
        }
        pts.sort((u, v) => u[0] - v[0] || u[1] - v[1]);
        const cr = (o, a2, b2) => (a2[0] - o[0]) * (b2[1] - o[1]) - (a2[1] - o[1]) * (b2[0] - o[0]), lo = [], hi = [];
        for (const q of pts) { while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
        for (const q of pts.slice().reverse()) { while (hi.length > 1 && cr(hi[hi.length - 2], hi[hi.length - 1], q) <= 0) hi.pop(); hi.push(q); }
        if (lo.length + hi.length > 5) poly = lo.slice(0, -1).concat(hi.slice(0, -1));
      }
    } else poly = [[bx[0], bx[1]], [bx[2], bx[1]], [bx[2], bx[3]], [bx[0], bx[3]]];
    const outer = poly.map((q, i) => [q, poly[(i + 1) % poly.length]]);
    // walls between units: the dashed lines inside the outline, joined into whole walls
    const groups = {};
    for (const [, , d] of dashes) {
      const mx = (d[0] + d[2]) / 2, my = (d[1] + d[3]) / 2; if (!inPoly(mx, my, poly)) continue;
      let ang = Math.atan2(d[3] - d[1], d[2] - d[0]); if (ang < 0) ang += Math.PI; if (ang >= Math.PI - 0.02) ang -= Math.PI;
      const ux = Math.cos(ang), uy = Math.sin(ang), off = -mx * uy + my * ux;
      const key = Math.round(ang * 30) + "|" + Math.round(off);
      const g = groups[key] || (groups[key] = { ux, uy, off, lo: 1e9, hi: -1e9 });
      for (const t of [d[0] * ux + d[1] * uy, d[2] * ux + d[3] * uy]) { g.lo = Math.min(g.lo, t); g.hi = Math.max(g.hi, t); }
    }
    const party = Object.values(groups).filter(g => g.hi - g.lo > 8).map(g => [[g.lo * g.ux - g.off * g.uy, g.lo * g.uy + g.off * g.ux], [g.hi * g.ux - g.off * g.uy, g.hi * g.uy + g.off * g.ux]]);
    const c = poly.reduce((a, q) => [a[0] + q[0] / poly.length, a[1] + q[1] / poly.length], [0, 0]);
    bldg[String(b.name)] = { poly, outer, party, c };
  }
  const nearestOn = (x, y, segs) => {            // closest point on any segment -> {x, y, d, seg}
    let best = null;
    for (const sg of segs) {
      const [[ax, ay], [bx2, by2]] = sg, L2 = (bx2 - ax) ** 2 + (by2 - ay) ** 2 || 1e-9;
      const t = Math.max(0, Math.min(1, ((x - ax) * (bx2 - ax) + (y - ay) * (by2 - ay)) / L2));
      const qx = ax + t * (bx2 - ax), qy = ay + t * (by2 - ay), d = Math.hypot(x - qx, y - qy);
      if (!best || d < best.d) best = { x: qx, y: qy, d, seg: sg };
    }
    return best;
  };
  const wallTurn = sg => -Math.atan2(sg[1][1] - sg[0][1], sg[1][0] - sg[0][0]);   // rotation.y that lays a box along this wall

  // lockboxes hang on the outside wall of their building, at the closest point to where they were placed
  const lbBldg = {};
  for (const l of (seed && seed.lockboxes) || []) if (l.building != null) lbBldg[l.name] = String(l.building);
  for (const it of job.items || []) { const m = /^Building\s+(.+)$/i.exec(it.group || ""); if (m && !lbBldg[it.name]) lbBldg[it.name] = m[1].trim(); }
  for (const [name, s] of Object.entries(spot)) {
    const k = (s.kind || "").toLowerCase(); if (!k.includes("lockbox") || k.includes("vault")) continue;
    let B = bldg[lbBldg[name]], hit = B && nearestOn(s.x, s.y, B.outer);
    if (!B) for (const cand of Object.values(bldg)) { const h = nearestOn(s.x, s.y, cand.outer); if (h.d < 30 * ppf && (!hit || h.d < hit.d)) { hit = h; B = cand; } }
    if (!hit) continue;
    const nx = hit.x - B.c[0], ny = hit.y - B.c[1], sg = hit.seg, ex = sg[1][0] - sg[0][0], ey = sg[1][1] - sg[0][1], el = Math.hypot(ex, ey) || 1;
    let ox = -ey / el, oy = ex / el; if (ox * nx + oy * ny < 0) { ox = -ox; oy = -oy; }   // points away from the building
    s.x = hit.x; s.y = hit.y; s.wall = { turn: wallTurn(sg), out: [ox, oy] };
  }

  const bMat = new THREE.MeshLambertMaterial({ color: 0xc9b79c, transparent: true, opacity: 0.55, depthWrite: false, side: THREE.DoubleSide });
  const pwMat = new THREE.MeshLambertMaterial({ color: 0xa8957a, transparent: true, opacity: 0.7 });
  const eMat = new THREE.LineBasicMaterial({ color: 0x6b5a45 });
  const bh = H.townhouse;   // real height, not stretched
  for (const [name, B] of Object.entries(bldg)) {
    const shape = new THREE.Shape(B.poly.map(([x, y]) => { const v = at(x, y); return new THREE.Vector2(v.x, v.z); }));
    const g = new THREE.ExtrudeGeometry(shape, { depth: bh, bevelEnabled: false });
    g.rotateX(Math.PI / 2); g.translate(0, bh, 0);             // footprint on the ground, walls straight up
    const m = new THREE.Mesh(g, bMat); m.name = "Bldg " + name; site.add(m);
    site.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 30), eMat));
    for (const [a, b] of B.party) {                            // walls between units
      const A = at(a[0], a[1]), Bv = at(b[0], b[1]), len = A.distanceTo(Bv);
      const w = new THREE.Mesh(new THREE.BoxGeometry(len, bh, 0.4), pwMat);
      w.position.set((A.x + Bv.x) / 2, bh / 2, (A.z + Bv.z) / 2); w.rotation.y = -Math.atan2(Bv.z - A.z, Bv.x - A.x); site.add(w);
    }
    const c = at(B.c[0], B.c[1]); const t = label("Bldg " + name, "#6b4e16"); t.position.set(c.x, bh + labelH, c.z); site.add(t);
  }

  // conduit / fiber runs, 36" under the ground, plus the drop down from each end
  const fMat = new THREE.MeshLambertMaterial({ color: 0xf08c00 });
  const dropMat = new THREE.MeshLambertMaterial({ color: 0xb36200 });
  const r = Math.max(0.25, labelH * 0.07);
  let runs = 0, missing = 0;
  // two conduits in one trench: give each its own lane side by side instead of drawing them on top of each other
  const gap = r * 4 * ppf, placed = [];          // print points between lanes
  const near = (s, t) => {                       // segment s runs along segment t (same line, overlapping)
    const tx = t[2] - t[0], ty = t[3] - t[1], tl = Math.hypot(tx, ty), sx = s[2] - s[0], sy = s[3] - s[1], sl = Math.hypot(sx, sy);
    if (tl < 1 || sl < 1 || Math.abs(tx * sy - ty * sx) / (tl * sl) > 0.2) return false;
    for (const [px, py, a, L] of [[(s[0] + s[2]) / 2, (s[1] + s[3]) / 2, t, tl], [(t[0] + t[2]) / 2, (t[1] + t[3]) / 2, s, sl]]) {   // either middle lies on the other
      const u = ((px - a[0]) * (a[2] - a[0]) + (py - a[1]) * (a[3] - a[1])) / (L * L);
      if (u < -0.05 || u > 1.05) continue;
      const qx = a[0] + u * (a[2] - a[0]), qy = a[1] + u * (a[3] - a[1]);
      if (Math.hypot(px - qx, py - qy) < gap * 1.5) return true;
    }
    return false;
  };
  const LANE = [0, 1, -1, 2, -2, 3, -3];
  for (const cd of (seed && seed.conduits) || []) {
    const a = spot[cd.a], b = spot[cd.b];
    if (!a || !b) { missing++; continue; }
    const pts = [[a.x, a.y], ...(cd.bends || []), [b.x, b.y]].filter((p, i, arr) => i === 0 || p[0] !== arr[i - 1][0] || p[1] !== arr[i - 1][1]);
    const segOff = [];                           // sideways shift of each segment, print points
    for (let i = 0; i < pts.length - 1; i++) {
      const sg = [pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]];
      const used = new Set(placed.filter(p => near(sg, p.sg)).map(p => p.lane));
      const lane = LANE.find(l => !used.has(l)) ?? 0;
      placed.push({ sg, lane });
      const L = Math.hypot(sg[2] - sg[0], sg[3] - sg[1]) || 1;
      segOff.push([-(sg[3] - sg[1]) / L * lane * gap, (sg[2] - sg[0]) / L * lane * gap]);
    }
    const shifted = pts.map((p, i) => {          // ends stay at the vault / lockbox; bends take the shift of the segments beside them
      if (i === 0 || i === pts.length - 1) return p;
      const o1 = segOff[i - 1], o2 = segOff[i];
      return [p[0] + (o1[0] + o2[0]) / 2, p[1] + (o1[1] + o2[1]) / 2];
    });
    if (shifted.length === 2 && (segOff[0][0] || segOff[0][1])) {   // a straight run with a twin: bend it out into its lane
      const [p, q] = shifted, o = segOff[0];
      shifted.splice(1, 0, [p[0] + (q[0] - p[0]) * 0.15 + o[0], p[1] + (q[1] - p[1]) * 0.15 + o[1]], [p[0] + (q[0] - p[0]) * 0.85 + o[0], p[1] + (q[1] - p[1]) * 0.85 + o[1]]);
    }
    const v = shifted.map(([x, y]) => at(x, y, H.fiber));
    const run = new THREE.Group(); run.name = `Fiber ${cd.a} to ${cd.b}`; site.add(run);
    for (let i = 0; i < v.length - 1; i++) run.add(tube(v[i], v[i + 1], r, fMat));
    run.add(tube(at(a.x, a.y, 0), v[0], r * 0.8, dropMat));
    run.add(tube(at(b.x, b.y, 0), v[v.length - 1], r * 0.8, dropMat));
    runs++;
  }

  // vaults (top even with the ground), cans, poles, lockboxes (16" up)
  const vMat = new THREE.MeshLambertMaterial({ color: 0x6c757d }), pMat = new THREE.MeshLambertMaterial({ color: 0x7a4f2a });
  const lMat = new THREE.MeshLambertMaterial({ color: 0x2b8a3e });
  const vs = Math.max(3, labelH * 0.9), vd = H.vaultDepth * stretch;
  for (const [name, s] of Object.entries(spot)) {
    const k = (s.kind || "").toLowerCase();
    if (k.includes("lockbox") && !k.includes("vault")) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2, 0.5), lMat);   // about a real lockbox: 18" x 24"
      m.position.copy(at(s.x, s.y)); m.position.y = H.lockbox + 1;   // bottom 16" up; real height, never stretched
      if (s.wall) { m.rotation.y = s.wall.turn; m.position.x += s.wall.out[0] * 0.25; m.position.z += s.wall.out[1] * 0.25; }   // flat against the outside wall
      m.name = name; site.add(m);
      const t = label(name, "#2b8a3e"); t.position.copy(m.position).add(new THREE.Vector3(0, labelH, 0)); site.add(t);
    } else if (k.includes("pole")) {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.8, 35, 10), pMat); m.position.copy(at(s.x, s.y)); m.position.y = 17.5; site.add(m);
      const t = label(name, "#7a4f2a"); t.position.copy(m.position).add(new THREE.Vector3(0, 20, 0)); site.add(t);
    } else if (k) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(vs, vd, vs * 0.7), vMat); m.position.copy(at(s.x, s.y)); m.position.y = -vd / 2; site.add(m);
      const t = label(name, "#343a40"); t.position.copy(at(s.x, s.y)).add(new THREE.Vector3(0, labelH * 0.8, 0)); site.add(t);
    }
  }

  // NID panels on the garages, 48" up
  const nMat = new THREE.MeshLambertMaterial({ color: 0x1f6feb });
  let nids = 0;
  for (const u of (seed && seed.units) || []) {
    if (u.nid_x == null) continue;
    let x = u.nid_x, y = u.nid_y, turn = 0, B = bldg[String(u.building)];
    const hit = B && nearestOn(x, y, [...B.party, ...B.outer]);
    if (hit && hit.d < 20) {                    // on the garage wall nearest to where the designer put it, on the same side
      const sg = hit.seg, ex = sg[1][0] - sg[0][0], ey = sg[1][1] - sg[0][1], el = Math.hypot(ex, ey) || 1;
      let ox = -ey / el, oy = ex / el; if (ox * (x - hit.x) + oy * (y - hit.y) < 0) { ox = -ox; oy = -oy; }
      x = hit.x + ox * 0.3 * ppf; y = hit.y + oy * 0.3 * ppf; turn = wallTurn(sg);
    }
    const m = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.6, 0.4), nMat); m.position.copy(at(x, y)); m.position.y = H.nid; m.rotation.y = turn;   // 48" up: real height, never stretched
    m.name = "NID " + (u.number || ""); site.add(m); nids++;
  }

  const bcount = Object.keys(bldg).length;
  say(`${bcount} buildings, ${runs} fiber runs, ${nids} NID panels.` +
      (stretch > 1 ? ` Underground depth drawn ${stretch}x so you can see it.` : "") +
      (missing ? ` ${missing} runs skipped (end point not found).` : "") +
      ` <div id="key"><span><i style="background:#f08c00"></i>Fiber 36" under</span><span><i style="background:#6c757d"></i>Vaults</span>` +
      `<span><i style="background:#2b8a3e"></i>Lockboxes 16"</span><span><i style="background:#1f6feb"></i>NIDs 48"</span>` +
      `<span><i style="background:#c9b79c"></i>Townhouses (1st floor only)</span></div>`);
}

function frame() {
  const size = Math.max(W, D);
  controls.target.set(0, 0, 0);
  const v = THREE.MathUtils.degToRad(camera.fov) / 2, h = Math.atan(Math.tan(v) * camera.aspect);
  const dist = size * 0.62 / Math.tan(Math.min(v, h));
  camera.position.copy(new THREE.Vector3(0.35, 0.8, 0.6).normalize().multiplyScalar(dist));
  camera.updateProjectionMatrix(); controls.update();
}

// ---------------------------------------------------------------- buttons
$("under").onclick = () => {
  seeUnder = !seeUnder; $("under").classList.toggle("on", seeUnder);
  if (groundMat) { groundMat.opacity = seeUnder ? 0.55 : 1; groundMat.depthWrite = !seeUnder; groundMat.needsUpdate = true; }
};
const setStretch = d => { stretch = Math.max(1, Math.min(10, stretch + d)); $("spread").textContent = stretch + "x"; build(); };
$("sless").onclick = () => setStretch(-1);
$("smore").onclick = () => setStretch(1);
$("reset").onclick = frame;

// one .glb file of what is on screen: opens on a computer in Windows "3D Viewer" or Blender, no key needed
$("dl").onclick = () => {
  if (!job) return;
  say("Making the 3D file…");
  const out = new THREE.Group(); out.name = job.name || "Site";
  for (const o of site.children) {
    if (o.isSprite) {            // labels: 3D files have no "always face me" labels, so lay each one flat, readable from above
      const sx = o.scale.x, sy = o.scale.y;
      const m = new THREE.Mesh(new THREE.PlaneGeometry(sx, sy), new THREE.MeshBasicMaterial({ map: o.material.map, transparent: true, side: THREE.DoubleSide }));
      m.rotation.x = -Math.PI / 2; m.position.copy(o.position); m.name = "Label";
      out.add(m);
    } else out.add(o.clone());
  }
  new GLTFExporter().parse(out, glb => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([glb], { type: "model/gltf-binary" }));
    a.download = `${job.name || "site"} 3D.glb`.replace(/[\\/:*?"<>|]/g, "");
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    say("Saved the 3D file. On a computer, open it with 3D Viewer or Blender.");
  }, err => say("Could not make the 3D file: " + err.message), { binary: true });
};

// ---------------------------------------------------------------- start
(async () => {
  if (!cfg.token) { say(`No GitHub key here. Open this from the GPS Shots icon on your Home Screen.`); return; }
  let slug = new URLSearchParams(location.search).get("p");
  if (!slug) { try { slug = JSON.parse(localStorage.getItem("gps.current") || "null"); } catch {} }
  slug = slug || "garden-homes-unilever-englewood-cliffs";
  try {
    say("Loading the site…");
    [job, readings] = await Promise.all([gh(`gps/jobs/${slug}.json`), gh(`gps/readings/${slug}.json`).catch(() => null)]);
    if (!job) { say("This project has no print or buildings yet, so there is nothing to show in 3D."); return; }
    if (readings && Array.isArray(job.items)) {   // boxes renamed or deleted on the phone (same as GPS Shots applyPrintEdits)
      const ren = readings.printRen || {}, del = readings.printDel || {};
      job.items = job.items.filter(i => !(del[i.name] && del[i.name].on)).map(i => ren[i.name] && ren[i.name].to ? Object.assign({}, i, { name: ren[i.name].to }) : i);
    }
    if (SEEDS[slug]) seed = await gh(SEEDS[slug]).catch(() => null);
    $("title").textContent = "3D " + (job.name || "Site");
    build(); frame();
  } catch (e) { say("Could not load: " + e.message); }
})();
</script>
</body>
