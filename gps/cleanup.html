<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cleanup Print</title>
<style>
  :root { --bg:#f3f5f4; --panel:#ffffff; --ink:#14201b; --muted:#3d4a44; --line:#c9d2ce; --accent:#0b6e4f; --accent-ink:#fff; --red:#c62828; --warn:#8a5a00;
          --body:-apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#111417; --panel:#1d2227; --ink:#f1f4f6; --muted:#d0d7dd; --line:#3c454e; --accent:#3dbe8b; --accent-ink:#06130e; --red:#ff6b6b; --warn:#ffc266; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:16px/1.3 var(--body); overflow:hidden; }
  body { display:flex; flex-direction:column; height:100dvh; }
  button, a.btn { font:inherit; border-radius:10px; padding:10px 13px; min-height:44px; cursor:pointer; text-decoration:none;
                  background:var(--panel); color:var(--ink); border:1px solid var(--line); display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  button.danger { background:var(--red); color:#fff; border-color:var(--red); }
  button.on { outline:3px solid var(--accent); outline-offset:-3px; font-weight:600; }
  button:disabled { opacity:.5; }
  #bar { display:flex; align-items:center; gap:8px; padding:6px 10px; padding-top:max(6px, env(safe-area-inset-top)); background:var(--panel); border-bottom:1px solid var(--line); }
  #bar .ttl { flex:1; min-width:0; line-height:1.15; }
  #bar .ttl b { display:block; font-size:17px; white-space:nowrap; }
  #bar .ttl span { display:block; font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #bar .meta { text-align:right; font-size:12px; color:var(--muted); line-height:1.25; white-space:nowrap; max-width:42vw; overflow:hidden; text-overflow:ellipsis; }
  #wrap { position:relative; flex:1; min-height:0; background:#fff; }
  #cv { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #hint { position:absolute; left:8px; right:8px; top:8px; background:var(--panel); color:var(--ink); border:2px solid var(--accent); border-radius:12px;
          padding:8px 10px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; box-shadow:0 2px 10px rgba(0,0,0,.18); }
  #hint-t { flex:1 1 220px; font-size:15px; }
  #hint .hb { display:flex; gap:6px; flex-wrap:wrap; }
  #hint button { min-height:38px; padding:6px 11px; }
  #tools { display:flex; gap:6px; padding:8px 10px; padding-bottom:max(8px, env(safe-area-inset-bottom)); background:var(--panel); border-top:1px solid var(--line); flex-wrap:wrap; }
  #tools button { flex:1 0 auto; padding:8px 10px; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  #modal.full { background:var(--bg); align-items:stretch; }
  #card { background:var(--panel); color:var(--ink); width:100%; max-width:640px; max-height:92dvh; overflow:auto; border-radius:16px 16px 0 0; padding:14px 14px max(14px, env(safe-area-inset-bottom)); position:relative; }
  #modal.full #card { max-height:none; height:100%; border-radius:0; padding-top:max(14px, env(safe-area-inset-top)); }
  @media (min-width:700px) { #modal { align-items:center; } #card { border-radius:16px; } #modal.full #card { border-radius:0; } }
  #card h2 { margin:0 0 6px; font-size:21px; padding-right:80px; }
  #card h3 { margin:16px 0 6px; font-size:15px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  #card p { margin:6px 0; }
  #card .pg { position:absolute; top:12px; right:14px; font-size:12px; color:var(--muted); }
  .list { display:flex; flex-direction:column; gap:8px; }
  .list > button { justify-content:flex-start; text-align:left; }
  .acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .acts button { flex:1 1 auto; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; }
  .seg button { flex:1 1 auto; min-height:40px; padding:6px 10px; }
  label.f { display:block; margin-top:10px; }
  label.f span { display:block; font-size:14px; color:var(--muted); margin-bottom:4px; }
  label.f input { width:100%; font:inherit; font-size:18px; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  .pgrow { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line); }
  .pgrow canvas { width:110px; height:84px; border:1px solid var(--line); border-radius:6px; background:#fff; flex:none; }
  .pgrow .bd { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .flag { color:var(--warn); font-weight:600; font-size:14px; }
  .lyr { display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px solid var(--line); }
  .lyr .dot { width:18px; height:18px; border-radius:50%; flex:none; border:1px solid rgba(0,0,0,.3); }
  .lyr .nm { flex:1; min-width:0; text-align:left; justify-content:flex-start; }
  .lyr .ct { font-size:13px; color:var(--muted); white-space:nowrap; }
  .lyr .sw { min-width:64px; }
  .note { font-size:14px; color:var(--muted); }
  .warn { color:var(--warn); font-weight:600; }
  #toast { position:fixed; left:50%; bottom:110px; transform:translateX(-50%); background:#14201b; color:#fff; padding:10px 16px; border-radius:22px; z-index:30; font-size:15px; max-width:90vw; text-align:center; }
  #pg { position:absolute; right:6px; bottom:4px; font-size:11px; color:#333; background:rgba(255,255,255,.8); padding:1px 5px; border-radius:6px; pointer-events:none; }
</style>
</head>
<body>
<div id="bar">
  <a class="btn" id="back" href="./">Back</a>
  <div class="ttl"><b>Cleanup print</b><span id="sub">Loading…</span></div>
  <div class="meta"><div id="save"></div><div id="ver"></div></div>
</div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hint" hidden><span id="hint-t"></span><span class="hb" id="hint-b"></span></div>
  <div id="pg">Page C-3</div>
</div>
<div id="tools"></div>
<div id="modal" hidden><div id="card"></div></div>
<div id="toast" hidden></div>

<script>
"use strict";
/* Cleanup print (Steven 2026-10-09): its own module, separate from the as-built designer, GPS Shots and Draw as-built.
   Bring a print in (the project's print, or upload a PDF or picture), pick per page: use as-is, clean up, or leave out.
   Clean up = sort what's on the print into named layers (streets, curbs, poles, extra stuff ...) that turn on and off,
   by look (same color + thickness) or with AI. His fixes are kept as examples for next time. Pages with match lines are
   pieced together into one whole-project sheet. NOTHING outside this page changes until he presses "Add to project".
   Work is kept in ASBUILT_MAKER gps/cleanup/<id>.json (+ <id>-page<n>.json / .jpg); the original print is never changed. */
const APP_VERSION = "V 01.00";
(async () => {   // phones keep an old copy of this page for a while: load the newest one when it changes (same as GPS Shots)
  try {
    const r = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
    const m = (await r.text()).match(/APP_VERSION = "([^"]+)"/);
    if (m && m[1] !== APP_VERSION && sessionStorage.getItem("cleanup.upd") !== m[1]) {
      sessionStorage.setItem("cleanup.upd", m[1]); const q = new URLSearchParams(location.search); q.set("v", m[1]); location.replace(location.pathname + "?" + q);
    }
  } catch {}
})();
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem("gps." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("gps." + k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem("gps." + k); } catch {} },
};
$("ver").textContent = APP_VERSION;
const qs = new URLSearchParams(location.search);
const projSlug = qs.get("p") || LS.get("current", "");
const cfg = Object.assign({ token: "", repo: "sgogats/ASBUILT_MAKER", branch: "main" }, LS.get("cfg", {}) || {});
$("back").onclick = e => { if (history.length > 1) { e.preventDefault(); history.back(); } };
const GARDEN = "garden-homes-unilever-englewood-cliffs";   // real job: an uploaded print can never replace its print
const slugify = s => (String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "job");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ---------------------------------------------------------------- GitHub (same key GPS Shots keeps on this device) */
function b64(str) { const bytes = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); return btoa(s); }
function decodeB64(s) { const bin = atob(s.replace(/\n/g, "")); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
function blobB64(blob) { return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = () => no(r.error); r.readAsDataURL(blob); }); }
const gh = {
  on() { return !!cfg.token; },
  url(path) { return `https://api.github.com/repos/${cfg.repo}/contents/${path.split("/").map(encodeURIComponent).join("/")}`; },
  headers(raw) { return { Authorization: "Bearer " + cfg.token, Accept: raw ? "application/vnd.github.raw+json" : "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }; },
  async get(path, raw) {   // raw: true = JSON, "blob" = file, false = info (sha)
    const r = await fetch(this.url(path) + "?ref=" + encodeURIComponent(cfg.branch) + "&t=" + Date.now(), { headers: this.headers(raw), cache: "no-store" });
    if (r.status === 404) return null;
    if (!r.ok) { const e = new Error("GitHub said " + r.status); e.status = r.status; throw e; }
    return raw === "blob" ? r.blob() : r.json();
  },
  async putRaw(path, content64, message) {
    for (let a = 0; a < 3; a++) {
      const m = await this.get(path, false).catch(() => null), body = { message, branch: cfg.branch, content: content64 };
      if (m && m.sha) body.sha = m.sha;
      const r = await fetch(this.url(path), { method: "PUT", headers: this.headers(false), body: JSON.stringify(body) });
      if (r.ok) return r.json();
      if (r.status !== 409 && r.status !== 422) { const e = new Error("GitHub said " + r.status); e.status = r.status; throw e; }
    }
    throw new Error("GitHub kept refusing the save");
  },
  put(path, obj, message) { return this.putRaw(path, b64(JSON.stringify(obj)), message); },
  async del(path, message) {
    const m = await this.get(path, false); if (!m) return;
    const r = await fetch(this.url(path), { method: "DELETE", headers: this.headers(false), body: JSON.stringify({ message, branch: cfg.branch, sha: m.sha }) });
    if (!r.ok) throw new Error("GitHub said " + r.status);
  },
};
const idb = (() => {   // pages are too big for localStorage
  let dbp; const open = () => dbp || (dbp = new Promise((ok, no) => { const r = indexedDB.open("gps", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }));
  return {
    async get(k) { try { const db = await open(); return await new Promise(ok => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); } catch { return null; } },
    async set(k, v) { try { const db = await open(); db.transaction("kv", "readwrite").objectStore("kv").put(v, k); } catch {} },
    async del(k) { try { const db = await open(); db.transaction("kv", "readwrite").objectStore("kv").delete(k); } catch {} },
  };
})();
function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("could not load " + src)); document.head.appendChild(s); }); }
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
async function pdfLib() { if (!window.pdfjsLib) await loadScript(PDFJS + "pdf.min.js"); pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; return pdfjsLib; }

let toastT = null;
function toast(t, ms) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, ms || 2800); }
function setSave(t) { $("save").textContent = t; }

/* ---------------------------------------------------------------- the work
   work = { id, name, created, updated, src: {kind:"project", slug, name, print} | {kind:"upload", file},
            layers: [{id, name, on, col}], pages: [page], sheet: {fitted}, added: {...} after Add to project }
   page = { n, use: "clean" | "asis" | "skip", kind: "vec" | "img", size, origin, match: [texts], ai: bool,
            groups: {look key: layer id}, over: {line index: layer id}, tover: {text index: layer id}, boxes: [{id, x0, y0, x1, y1, layer}],
            place: {x, y, r, s} on the whole-project sheet }
   page contents (lines / texts / picture) live in pageData[n]: {plan} or {img, blob} */
let work = null, pageData = {}, cur = 0;   // cur = index into work.pages of the page being cleaned
let screen = "start";                      // start / clean / sheet
const LCOL = ["#d62828", "#1f5fd6", "#2e9d4f", "#e07000", "#7b3fbf", "#00838f", "#b8860b", "#c2185b", "#4b5563", "#6d4c41", "#0b6e4f", "#f2c500"];
const UNSORTED = "unsorted";
const layerById = id => work.layers.find(l => l.id === id);
function addLayer(name, col) {
  const have = work.layers.find(l => l.name.toLowerCase() === String(name).trim().toLowerCase()); if (have) return have;
  const l = { id: uid(), name: String(name).trim() || "New layer", on: true, col: col || LCOL[work.layers.length % LCOL.length] };
  work.layers.push(l); return l;
}
const lookKey = l => l[0] + "|" + l[1];
const textKey = t => "t|" + Math.round(t[3] || 8);
function lineLayer(pg, i, l) { return pg.over[i] || pg.groups[lookKey(l)] || UNSORTED; }
function textLayer(pg, i, t) { return pg.tover[i] || pg.groups[textKey(t)] || UNSORTED; }
const layerOn = id => { if (id === UNSORTED) return true; const l = layerById(id); return !l || l.on; };
const usedPages = () => work.pages.filter(p => p.use !== "skip");
let ver = 0;   // bumps on every change, so the cached drawing is rebuilt

/* ---------------------------------------------------------------- saving (this device right away, GitHub a moment later) */
let saveT = null, saving = false, again = false;
function touch() { ver++; work.updated = Date.now(); LS.set("cleanup.w." + work.id, work); listAdd(work); clearTimeout(saveT); setSave("Saving…"); saveT = setTimeout(saveNow, 2500); }
function listAdd(w) { const L = (LS.get("cleanup.list", []) || []).filter(x => x.id !== w.id); L.unshift({ id: w.id, name: w.name, updated: w.updated }); LS.set("cleanup.list", L.slice(0, 40)); }
const sent = {};   // page files already on GitHub for this work
async function saveNow() {
  if (!work) return;
  if (!gh.on()) { setSave("Kept on this device (no key)"); return; }
  if (saving) { again = true; return; }
  saving = true;
  try {
    for (const p of work.pages) {
      const k = work.id + "|" + p.n; if (sent[k] || p.sent) continue;
      const d = pageData[p.n]; if (!d) continue;
      if (d.plan) await gh.put(`gps/cleanup/${work.id}-page${p.n}.json`, d.plan, `Cleanup print: ${work.name} page ${p.n}`);
      else if (d.blob) await gh.putRaw(`gps/cleanup/${work.id}-page${p.n}.jpg`, await blobB64(d.blob), `Cleanup print: ${work.name} page ${p.n}`);
      sent[k] = true; p.sent = true;
    }
    await gh.put(`gps/cleanup/${work.id}.json`, work, `Cleanup print: ${work.name}`);
    LS.set("cleanup.w." + work.id, work); setSave("Saved");
  } catch (e) { setSave("Not sent yet · kept on this device"); clearTimeout(saveT); saveT = setTimeout(saveNow, 20000); }
  saving = false; if (again) { again = false; saveNow(); }
}
async function keepPage(n, d) { pageData[n] = d; await idb.set(`cleanup.${work.id}.page${n}`, d.plan ? { plan: d.plan } : { blob: d.blob }); }
async function loadPage(w, p) {
  let d = await idb.get(`cleanup.${w.id}.page${p.n}`);
  if (!d && gh.on()) {
    try { d = p.kind === "vec" ? { plan: await gh.get(`gps/cleanup/${w.id}-page${p.n}.json`, true) } : { blob: await gh.get(`gps/cleanup/${w.id}-page${p.n}.jpg`, "blob") }; } catch { d = null; }
    if (d && (d.plan || d.blob)) idb.set(`cleanup.${w.id}.page${p.n}`, d);
  }
  if (!d || !(d.plan || d.blob)) return null;
  if (d.blob) d.img = await blobImg(d.blob);
  return d;
}
function blobImg(blob) { return new Promise(ok => { const img = new Image(); img.onload = () => ok(img); img.onerror = () => ok(null); img.src = URL.createObjectURL(blob); }); }

/* ---------------------------------------------------------------- reading a print */
/* PDF page -> plan {size, origin, lines: [[color, width, [x, y, ...]]], texts: [[x, y, words, size, color, turn]]} in page points, y down (same shape as the GPS Shots print) */
async function pageToPlan(pdfjsLib, pg) {
  const OPS = pdfjsLib.OPS, vp = pg.getViewport({ scale: 1 }), V = vp.transform;
  const mul = (a, b) => [a[0]*b[0]+a[2]*b[1], a[1]*b[0]+a[3]*b[1], a[0]*b[2]+a[2]*b[3], a[1]*b[2]+a[3]*b[3], a[0]*b[4]+a[2]*b[5]+a[4], a[1]*b[4]+a[3]*b[5]+a[5]];
  const hex = a => { if (typeof a[0] === "string") return a[0]; const v = Array.from(a).slice(0, 3), big = a instanceof Uint8ClampedArray || v.some(x => x > 1); return "#" + v.map(x => Math.max(0, Math.min(255, Math.round(big ? x : x * 255))).toString(16).padStart(2, "0")).join(""); };
  const ol = await pg.getOperatorList(), lines = [], fills = [];
  let st = { m: V, sc: "#000000", fc: "#000000", w: 1 }; const stack = [];
  let pending = null;   // paths built by constructPath, waiting for stroke/fill
  const r1 = v => Math.round(v * 10) / 10;
  for (let i = 0; i < ol.fnArray.length; i++) {
    const f = ol.fnArray[i], a = ol.argsArray[i];
    if (f === OPS.save) stack.push(Object.assign({}, st));
    else if (f === OPS.restore) { if (stack.length) st = stack.pop(); }
    else if (f === OPS.transform) st.m = mul(st.m, a);
    else if (f === OPS.setLineWidth) st.w = a[0];
    else if (f === OPS.setStrokeRGBColor || f === OPS.setStrokeColor) st.sc = hex(a);
    else if (f === OPS.setFillRGBColor || f === OPS.setFillColor) st.fc = hex(a);
    else if (f === OPS.setStrokeGray) st.sc = hex([a[0], a[0], a[0]]);
    else if (f === OPS.setFillGray) st.fc = hex([a[0], a[0], a[0]]);
    else if (f === OPS.constructPath) {
      const ops = a[0], c = a[1], m = st.m, P = (x, y) => [r1(m[0]*x + m[2]*y + m[4]), r1(m[1]*x + m[3]*y + m[5])];
      const subs = pending && pending.m === m ? pending.subs : []; let cur = null, k = 0, start = null;
      for (const op of ops) {
        if (op === OPS.moveTo) { cur = [...P(c[k], c[k+1])]; start = cur.slice(0, 2); subs.push(cur); k += 2; }
        else if (op === OPS.lineTo) { if (!cur) { cur = []; subs.push(cur); } cur.push(...P(c[k], c[k+1])); k += 2; }
        else if (op === OPS.curveTo) { if (cur) { const x0 = cur[cur.length-2], y0 = cur[cur.length-1]; const p1 = P(c[k],c[k+1]), p2 = P(c[k+2],c[k+3]), p3 = P(c[k+4],c[k+5]); for (let t = 0.25; t <= 1.001; t += 0.25) { const u = 1-t; cur.push(r1(u*u*u*x0+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0]), r1(u*u*u*y0+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1])); } } k += 6; }
        else if (op === OPS.curveTo2 || op === OPS.curveTo3) { if (cur) cur.push(...P(c[k+2], c[k+3])); k += 4; }
        else if (op === OPS.closePath) { if (cur && start) cur.push(...start); }
        else if (op === OPS.rectangle) { const [x, y, w, h] = [c[k], c[k+1], c[k+2], c[k+3]]; cur = [...P(x, y), ...P(x+w, y), ...P(x+w, y+h), ...P(x, y+h), ...P(x, y)]; subs.push(cur); cur = null; k += 4; }
      }
      pending = { m, subs };
    }
    else if (f === OPS.stroke || f === OPS.closeStroke || f === OPS.fillStroke || f === OPS.eoFillStroke || f === OPS.closeFillStroke || f === OPS.closeEOFillStroke) {
      if (pending) { const sw = Math.max(0.1, st.w * Math.hypot(st.m[0], st.m[1])); for (const s of pending.subs) if (s.length >= 4) lines.push([st.sc, r1(sw), s]); }
      pending = null;
    }
    else if (f === OPS.fill || f === OPS.eoFill) {
      if (pending) for (const s of pending.subs) if (s.length >= 6) fills.push([st.fc, 0, s]);
      pending = null;
    }
    else if (f === OPS.endPath) pending = null;
  }
  for (const s of fills) lines.push([s[0], 0.5, s[2]]);   // filled shapes drawn as outlines
  const tc = await pg.getTextContent(), texts = [];

      const vec = f.kind === "vec", path = `gps/prints/${p.slug}.cleanup-${t}.${vec ? "json" : "jpg"}`;
      if (vec) await gh.put(path, f.plan, msg);
      else await gh.putRaw(path, await blobB64(await new Promise(ok => f.canvas.toBlob(ok, "image/jpeg", 0.85))), msg);
      $("ad-t").textContent = "Updating the project list…";
      const rec = { kind: vec ? "dxf" : "pdf", path, size: vec ? f.plan.size : f.size, file: "Cleanup print: " + work.name, t };
      const before = await editProjects(d => {
        if (d.removed) delete d.removed[p.slug];
        let q = d.projects.find(x => x.slug === p.slug); if (!q) { q = { name: p.name, slug: p.slug, t }; d.projects.push(q); }
        const b = q.print || null; q.print = rec; return b;
      }, msg);
      undo = { kind: "project", slug: p.slug, before, isNew: !!p.isNew };
    }
    work.added = { t, name: p.name, slug: p.slug, undo }; touch(); await saveNow();
    modal(`<h2>Added to ${esc(p.name)}</h2><p>Open ${esc(p.name)} in GPS Shots to see it. If it doesn't look right, come back here and press Undo add to project.</p>
      <div class="acts"><button id="d-x">OK</button></div>`);
    $("d-x").onclick = showAdd;
  } catch (e) { modal(`<h2>Didn't finish</h2><p>${esc(e.message)}</p><div class="acts"><button class="primary" id="d-x">OK</button></div>`); $("d-x").onclick = showAdd; }
}
async function undoAdd() {
  const a = work.added, u = a && a.undo; if (!u) return;
  modal(`<h2>Undo add to ${esc(a.name)}?</h2><p>${esc(a.name)} goes back to the print it had before.</p><div class="acts"><button id="u-x">Cancel</button><button class="danger" id="u-ok">Undo</button></div>`);
  $("u-x").onclick = showAdd;
  $("u-ok").onclick = async () => {
    try {
      if (u.kind === "job") { if (u.backup) await gh.put(u.path, await gh.get(u.backup, true), `Cleanup print: undo, ${a.name} gets its old print back`); else await gh.del(u.path, `Cleanup print: undo, ${a.name} gets its old print back`); }
      else await editProjects(d => { const q = d.projects.find(x => x.slug === u.slug); if (q) { if (u.before) q.print = Object.assign({}, u.before, { t: Date.now() }); else delete q.print; } }, `Cleanup print: undo, ${a.name} gets its old print back`);
      delete work.added; touch(); await saveNow(); toast("Undone"); showAdd();
    } catch (e) { toast("Couldn't undo: " + e.message, 5000); }
  };
}

/* ---------------------------------------------------------------- start */
if (!gh.on()) setSave("No key: open from the Home Screen icon");
showStart();
</script>
