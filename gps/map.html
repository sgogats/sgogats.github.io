<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPS Shots Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
/* Satellite map of every saved GPS shot. Reads the same GitHub key GPS Shots saved on this phone. */
:root { --bg: #eef2ef; --panel: #ffffff; --ink: #13201b; --muted: #5b6a63; --line: #cfd8d3; --accent: #0b6e4f;
  --lb: #e53935; --vault: #2f7bff; --other: #18b26b; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0e1412; --panel: #18201d; --ink: #e3ebe6; --muted: #93a39b; --line: #2c3833; --accent: #3dbe8b; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0e1412; --panel: #18201d; --ink: #e3ebe6; --muted: #93a39b; --line: #2c3833; --accent: #3dbe8b; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
header { display: flex; gap: 8px; align-items: center; padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
header a { color: var(--accent); font-weight: 600; text-decoration: none; white-space: nowrap; }
select { flex: 1; min-width: 0; min-height: 44px; font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
#map { flex: 1; }
#msg { position: absolute; z-index: 1000; left: 12px; right: 12px; top: 72px; background: var(--panel); color: var(--ink); border-radius: 10px; padding: 12px 14px; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
#msg a { color: var(--accent); font-weight: 600; }
.lbl { background: rgba(0,0,0,.65); color: #fff; border: 0; box-shadow: none; font-weight: 700; font-size: 13px; padding: 1px 5px; }
.lbl::before { display: none; }
.leaflet-popup-content { font-size: 15px; line-height: 1.4; }
.leaflet-popup-content a { font-weight: 700; }
.locate { width: 44px; height: 44px; font-size: 22px; line-height: 44px; text-align: center; background: #fff; color: #222; cursor: pointer; display: block; }
</style>
</head>
<body>
<header>
  <a href="./" onclick="if (history.length > 1) { history.back(); return false; }">‹ Back</a>
  <select id="proj" aria-label="Project"></select>
</header>
<div id="map"></div>
<div id="msg" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let cfg = {}; try { cfg = JSON.parse(localStorage.getItem("gps.cfg") || "{}") || {}; } catch {}
cfg = Object.assign({ repo: "sgogats/ASBUILT_MAKER", branch: "main" }, cfg);
const say = html => { $("msg").innerHTML = html; $("msg").hidden = !html; };

const map = L.map("map", { zoomControl: true }).setView([40.8935, -73.9455], 17);
const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 21, maxNativeZoom: 19, attribution: "Imagery © Esri" }).addTo(map);
const streets = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 21, maxNativeZoom: 19, attribution: "© OpenStreetMap" });
L.control.layers({ Satellite: sat, Streets: streets }).addTo(map);
const Locate = L.Control.extend({ onAdd() { const b = L.DomUtil.create("a", "locate leaflet-bar"); b.title = "Where am I"; b.textContent = "◎";
  L.DomEvent.on(b, "click", e => { L.DomEvent.stop(e); map.locate({ setView: true, maxZoom: 19, enableHighAccuracy: true }); }); return b; } });
map.addControl(new Locate({ position: "topleft" }));
let me = null;
map.on("locationfound", e => { if (me) me.remove(); me = L.circleMarker(e.latlng, { radius: 8, color: "#fff", weight: 3, fillColor: "#1a73e8", fillOpacity: 1 }).addTo(map).bindTooltip("You", { className: "lbl" }); });

const layer = L.layerGroup().addTo(map);
let docs = [];
function color(n, kind) {
  if (/^lb/i.test(n) || kind === "Lockbox") return getComputedStyle(document.documentElement).getPropertyValue("--lb");
  if (/^v[^a-z]|vault|^crossover/i.test(n) || /vault|can|main/i.test(kind || "")) return getComputedStyle(document.documentElement).getPropertyValue("--vault");
  return getComputedStyle(document.documentElement).getPropertyValue("--other");
}
function draw() {
  layer.clearLayers();
  const pick = $("proj").value, pts = [];
  for (const d of docs) {
    if (pick && d.slug !== pick) continue;
    const kinds = {}; for (const e of d.extra || []) kinds[e.name] = e.kind;
    // walked trenches (v03.50): the smoothed line from the start reading to the stop reading
    for (const [rn, tr] of Object.entries(d.tracks || {})) {
      const info = (d.runs || {})[rn] || {}, A = info.from && (d.items || {})[info.from], B = info.to && (d.items || {})[info.to];
      const ll = info.drawnLL && info.drawnLL.length > 1 ? info.drawnLL.map(p => [p[0], p[1]])   // drawn by hand on the print (Steven 2026-10-06)
        : smoothTrack(tr, A && A.lat != null ? A : null, B && B.lat != null ? B : null).map(p => [p.lat, p.lon]); if (ll.length < 2) continue;
      ll.forEach(p => pts.push(p));
      const col = ({ '1"': "#8a8f98", '1¼"': "#b39a6e", '1½"': "#d99447", '2"': "#ff8c1a", '3"': "#e03a1e", '4"': "#8e3fbf" })[info.size] || (info.kind === "Aerial" ? "#6d4c41" : "#ff8c1a");   // conduit size colors (Steven 2026-10-05); pole line spans brown
      L.polyline(ll, { color: col, weight: 5, opacity: 0.95 }).addTo(layer).bindTooltip(esc(rn + (info.size ? ` · ${info.size} conduit` : "")), { sticky: true, className: "lbl" });
    }
    // conduit runs: one continuous line through their points, joined to the vault/pole at each end (Steven 2026-10-03)
    const runs = {};
    for (const [n, r] of Object.entries(d.items || {})) if (r.run && r.lat != null) (runs[r.group] = runs[r.group] || []).push([parseInt(n.split(" point ")[1]) || 0, r]);
    for (const [rn, list] of Object.entries(runs)) {
      const info = (d.runs || {})[rn] || {}, end = k => { const e = info[k] && (d.items || {})[info[k]]; return e && e.lat != null ? [[e.lat, e.lon]] : []; };
      const ll = [...end("from"), ...list.sort((a, b) => a[0] - b[0]).map(([, r]) => [r.lat, r.lon]), ...end("to")];
      ll.forEach(p => pts.push(p));
      L.polyline(ll, { color: "#ff8c1a", weight: 5, opacity: 0.95 }).addTo(layer).bindTooltip(esc(rn), { sticky: true, className: "lbl" });
    }
    // walked buildings: outline through the corners
    const bs = {};
    for (const [n, r] of Object.entries(d.items || {})) if (r.corner && r.lat != null) (bs[r.group] = bs[r.group] || []).push([parseInt(n.split(" corner ")[1]) || 0, r]);
    for (const [g, list] of Object.entries(bs)) {
      const ll = list.sort((a, b) => a[0] - b[0]).map(([, r]) => [r.lat, r.lon]); ll.forEach(p => pts.push(p));
      L.polygon(ll, { color: "#ff3fa4", weight: 3, fillOpacity: 0.15 }).addTo(layer).bindTooltip(esc(g), { sticky: true, className: "lbl" });
    }
    for (const [n, r] of Object.entries(d.items || {})) {
      if (r.lat == null || r.run || r.corner) continue;
      const ll = [r.lat, r.lon], b2 = (d.labels || {})[n], c = color(n, kinds[n]);
      pts.push(ll);
      L.circle(ll, { radius: (r.acc_ft || 0) / 3.28084, color: c, weight: 1, fillOpacity: 0.12, interactive: false }).addTo(layer);
      const when = r.t ? new Date(r.t).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
      L.circleMarker(ll, { radius: 8, color: "#fff", weight: 2, fillColor: c, fillOpacity: 1 }).addTo(layer)
        .bindTooltip(esc(b2 ? `${n} · ${b2}` : n), { permanent: true, direction: "right", offset: [8, 0], className: "lbl" })
        .bindPopup(`<b>${esc(n)}</b>${b2 ? `<br>${esc(b2)}` : ""}<br>${esc(d.project || d.slug)}<br>±${Math.round(r.acc_ft || 0)} ft · ${esc(when)}<br>`
          + `<a href="https://www.google.com/maps/search/?api=1&query=${r.lat.toFixed(7)},${r.lon.toFixed(7)}" target="_blank" rel="noopener">Open in Google Maps</a>`);
    }
  }
  if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 19 });
  say(pts.length ? "" : "No GPS shots saved for this project yet.");
}
// straight runs (Steven 2026-10-06): electric and low-voltage go in straight lines, so the walk is drawn as straight legs
// with a turn only where the direction clearly changes. Rough fixes and jumps (GPS bouncing off buildings) are dropped. The raw dots stay saved.
function smoothTrack(raw, a, b) {
  let pts = raw.map(q => ({ lat: q[0], lon: q[1], acc: q[2] }));
  const accs = pts.map(p => p.acc || 0).filter(v => v > 0).sort((x, y) => x - y), med = accs.length ? accs[accs.length >> 1] : 10;
  if (pts.length > 4) pts = pts.filter(p => !(p.acc > Math.max(med * 2.5, 30)));
  const ends = [a, ...pts, b].filter(Boolean); if (ends.length < 3) return ends.map(p => ({ lat: p.lat, lon: p.lon }));
  const lat0 = ends[0].lat, lon0 = ends[0].lon, c0 = Math.cos(lat0 * Math.PI / 180);
  const to = p => ({ x: (p.lon - lon0) * 364000 * c0, y: (p.lat - lat0) * 364000 }), back = p => ({ lat: lat0 + p.y / 364000, lon: lon0 + p.x / (364000 * c0) });
  let P = ends.map(to);
  const mid = v => { const s = v.slice().sort((x, y) => x - y); return s[s.length >> 1]; };
  const jump = Math.max(15, med * 2);   // a dot this far from the middle of its neighbours is a jump
  P = P.filter((p, i) => { if (i === 0 || i === P.length - 1) return true; const w = P.slice(Math.max(0, i - 3), i + 4); return Math.hypot(p.x - mid(w.map(q => q.x)), p.y - mid(w.map(q => q.y))) <= jump; });
  const n = P.length;
  const avg = P.map((p, i) => { if (i === 0 || i === n - 1) return p; let sx = 0, sy = 0, k = 0; for (let j = Math.max(0, i - 5); j <= Math.min(n - 1, i + 5); j++) { sx += P[j].x; sy += P[j].y; k++; } return { x: sx / k, y: sy / k }; });
  const tol = Math.min(20, Math.max(10, med * 0.8)), keep = new Array(n).fill(false); keep[0] = keep[n - 1] = true;   // straight legs: Douglas-Peucker, 10-20 ft
  (function dp(i, j) {
    let best = 0, bi = -1; const A = avg[i], B = avg[j], dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1;
    for (let m = i + 1; m < j; m++) { const d = Math.abs(dy * (avg[m].x - A.x) - dx * (avg[m].y - A.y)) / L; if (d > best) { best = d; bi = m; } }
    if (best > tol) { keep[bi] = true; dp(i, bi); dp(bi, j); }
  })(0, n - 1);
  const line = avg.filter((_, i) => keep[i]);
  const turn = i => { const p = line[i - 1], q = line[i], r = line[i + 1], a1 = Math.atan2(q.y - p.y, q.x - p.x), a2 = Math.atan2(r.y - q.y, r.x - q.x); let d = Math.abs(a2 - a1) * 180 / Math.PI; return d > 180 ? 360 - d : d; };
  const len = i => Math.hypot(line[i + 1].x - line[i].x, line[i + 1].y - line[i].y);
  for (let done = false; !done && line.length > 2;) {   // no small bends or short zig-zags: a turn under 25 degrees or a leg under 10 ft goes
    done = true; let bi = -1, bt = 1e9;
    for (let i = 1; i < line.length - 1; i++) { const t = turn(i); if ((t < 25 || len(i - 1) < 10 || len(i) < 10) && t < bt) { bt = t; bi = i; } }
    if (bi > 0) { line.splice(bi, 1); done = false; }
  }
  return line.map(back);
}
async function gh(path, raw) {
  const r = await fetch(`https://api.github.com/repos/${cfg.repo}/contents/${path}?ref=${encodeURIComponent(cfg.branch)}&t=${Date.now()}`,
    { headers: { Authorization: "Bearer " + cfg.token, Accept: raw ? "application/vnd.github.raw+json" : "application/vnd.github+json" }, cache: "no-store" });
  if (!r.ok) throw new Error(r.status === 401 ? "GitHub key was refused." : "GitHub said " + r.status);
  return r.json();
}
async function load() {
  if (!cfg.token) { say(`This phone has no GitHub key yet. Open <a href="./">GPS Shots</a>, go to Setup, paste your key, then come back.`); return; }
  say("Loading shots…");
  try {
    const list = (await gh("gps/readings")).filter(f => f.name.endsWith(".json"));
    docs = (await Promise.all(list.map(f => gh("gps/readings/" + f.name, true).catch(() => null)))).filter(Boolean);
    docs.forEach((d, i) => { d.slug = d.slug || list[i].name.replace(/\.json$/, ""); });
    const withPts = docs.filter(d => Object.values(d.items || {}).some(r => r.lat != null));
    let last = ""; try { last = JSON.parse(localStorage.getItem("gps.current") || '""'); } catch {}
    const q = new URLSearchParams(location.search); if (q.get("p")) last = q.get("p");
    $("proj").innerHTML = `<option value="">All projects</option>` + withPts.map(d => `<option value="${esc(d.slug)}">${esc(d.slug === "random-locations" ? "System locations" : d.project || d.slug)}</option>`).join("");
    if (withPts.some(d => d.slug === last)) $("proj").value = last;
    draw();
    // opened from one point: zoom in on it and show its details
    const n = q.get("n"), d = docs.find(x => x.slug === last), r = n && d && (d.items || {})[n];
    if (r && r.lat != null) { map.setView([r.lat, r.lon], 20); layer.eachLayer(l => { if (l.getPopup && l.getPopup() && l.getLatLng().lat === r.lat && l.getLatLng().lng === r.lon) l.openPopup(); }); }
  } catch (e) { say("Could not load shots: " + esc(e.message)); }
}
$("proj").onchange = draw;
load();
</script>
</body>
</html>
